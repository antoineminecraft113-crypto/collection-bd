<style>
  :root{
    color-scheme: light only;
    --ink:#17171A;
    --ink-soft:#83807A;
    --blue-top:#4D94FA;
    --blue-bottom:#3968E8;
    --bg:#3968E8;
    --well:#EEF1F7;
    --card:#FFFFFF;
    --line:#E7E5DE;
    --accent:#1F3A54;
    --gold:#B4872A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  #insuranceDoc{ display:none; }
  @media print{
    html, body{ height:auto !important; overflow:visible !important; position:static !important; background:#fff !important; }
    #app, .lightbox-overlay, .sheet, .sheet-backdrop, .bg-fixed{ display:none !important; }
    body > *:not(#insuranceDoc){ display:none !important; }
    #insuranceDoc{ display:block !important; position:static; background:#fff; color:#111; padding:0; font-family:-apple-system,Helvetica,Arial,sans-serif; }
    #insuranceDoc h1{ font-size:20px; margin:0 0 4px; }
    #insuranceDoc h2{ font-size:14px; margin:22px 0 8px; border-bottom:1px solid #ccc; padding-bottom:4px; }
    #insuranceDoc tr.serie-group{ page-break-after:avoid; }
    #insuranceDoc tr.serie-group td{ font-weight:700; font-size:12px; background:#eef1f6; border-bottom:1px solid #ccc; padding-top:8px; }
    #insuranceDoc .meta{ font-size:12px; color:#555; margin-bottom:16px; }
    #insuranceDoc table{ width:100%; border-collapse:collapse; font-size:11px; }
    #insuranceDoc th, #insuranceDoc td{ text-align:left; padding:4px 6px; border-bottom:1px solid #ddd; }
    #insuranceDoc tr{ page-break-inside:avoid; }
    #insuranceDoc .totals{ display:flex; gap:24px; font-size:13px; margin-bottom:10px; }
  }
  html,body{ height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--blue-bottom);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .bg-fixed{ position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg, var(--blue-top), var(--blue-bottom)); }
  .mono{ font-variant-numeric:tabular-nums; }
  #app{
    max-width:600px; margin:0 auto; height:100%; height:100dvh; display:flex; flex-direction:column; position:relative;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  header.topbar{
    padding: calc(var(--safe-top) + 14px) 20px 14px;
    background:rgba(41,94,235,0.22);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.14);
    border-radius:0 0 18px 18px;
    position:sticky; top:0; z-index:20;
  }
  header.topbar h1{ font-size:19px; margin:0 0 2px; font-weight:600; letter-spacing:-0.01em; color:#fff; }
  header.topbar .sub{ font-size:12.5px; color:rgba(255,255,255,0.78); }
  header.topbar.centered h1, header.topbar.centered .sub{ text-align:center; }
  main{ flex:1; padding: 18px 18px calc(90px + var(--safe-bottom)); color:rgba(255,255,255,0.92); }

  /* ---- cards & shared bits ---- */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; color:var(--ink); }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin:26px 2px 12px; }
  #main .section-title{ color:rgba(255,255,255,0.68); }
  #main .link-btn{ color:#fff; }
  .back-btn{ background:none; border:none; color:#fff; font-size:13.5px; font-weight:600; padding:4px 2px; }
  #main .count-line{ color:rgba(255,255,255,0.72); }
  #main .empty{ color:rgba(255,255,255,0.72); }
  #main .rarity-rank{ color:rgba(255,255,255,0.6); }
  #main .field label{ color:rgba(255,255,255,0.78); }
  #main .photos-title{ color:#fff; }
  #main .photo-hint{ color:rgba(255,255,255,0.75); }
  #main .form-msg{ color:#fff; }
  #main .bar-label{ color:#fff; }
  #main .card .section-title{ color:var(--ink-soft); }
  #main .card .link-btn{ color:var(--accent); }
  #main .card .count-line{ color:var(--ink-soft); }
  #main .card .empty{ color:var(--ink-soft); }
  #main .card .rarity-rank{ color:var(--ink-soft); }
  #main .card .form-msg{ color:var(--accent); }
  #main .card .bar-label{ color:var(--ink); }
  .section-title:first-child{ margin-top:0; }

  /* ---- Shelf ---- */
  .shelf-wrap{ padding:18px 14px 16px; margin-bottom:16px; }
  .shelf{ display:flex; align-items:flex-end; gap:2px; overflow-x:auto; padding: 4px 2px 6px; scrollbar-width:none; }
  .shelf::-webkit-scrollbar{ display:none; }
  .spine{
    flex:0 0 auto; height:150px; background:var(--card); border:1px solid var(--line);
    border-radius:5px 5px 2px 2px; display:flex; align-items:center; justify-content:center;
    padding:10px 0; cursor:pointer; overflow:hidden;
  }
  .spine .label{
    writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg);
    font-size:11px; font-weight:600; color:var(--ink); letter-spacing:0.02em;
    max-height:100%; overflow:hidden; white-space:nowrap;
  }
  .shelf-floor{ height:1px; background:var(--line); margin:0 2px 4px; }

  .mini-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
  .mini-stats-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mini-stat{ padding:12px 8px; text-align:center; }
  .mini-stat .val{ font-size:15.5px; font-weight:700; }
  .mini-stat .lab{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }

  .vitrine-card{ display:flex; align-items:center; gap:14px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .vitrine-thumb{
    width:60px; height:82px; border-radius:8px; background:var(--well); border:1px solid var(--line);
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-soft); overflow:hidden;
  }
  .vitrine-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .vitrine-thumb .ph-icon{ font-size:18px; margin-bottom:4px; }
  .vitrine-thumb .ph-hint{ font-size:8.5px; text-align:center; line-height:1.2; padding:0 4px; }
  .vitrine-main{ flex:1; min-width:0; }
  .vitrine-title{ font-size:14.5px; font-weight:700; }
  .vitrine-meta{ font-size:12px; color:var(--ink-soft); }
  .chev{ color:var(--ink-soft); font-size:16px; }
  .rename-mini-btn{ background:none; border:none; color:var(--ink-soft); font-size:15px; padding:6px; flex:0 0 auto; }

<script>
/* ================================================================
   MODE VISITEUR — détection et isolation complète du stockage.
   Doit être évalué EN PREMIER, avant tout chargement de données :
   toutes les clés localStorage et la base IndexedDB utilisées ensuite
   dépendent de IS_VISITOR pour ne jamais toucher aux données réelles
   de l'appareil pendant une session visiteur.
   ================================================================ */
const LS_VISITOR_SESSION = "bdcollection_visitor_session_v1";
function loadVisitorSessionRaw(){
  try{
    const raw = localStorage.getItem(LS_VISITOR_SESSION);
    if(!raw) return null;
    const session = JSON.parse(raw);
    if(!session || !session.expiresAt) return null;
    if(new Date(session.expiresAt).getTime() <= Date.now()) return "expired";
    return session;
  }catch(e){ return null; }
}
const VISITOR_SESSION_RAW = loadVisitorSessionRaw();
const VISITOR_EXPIRED = VISITOR_SESSION_RAW === "expired";
const IS_VISITOR = !!VISITOR_SESSION_RAW && !VISITOR_EXPIRED;
// Toute clé de stockage "normale" passe par ici : en session visiteur, elle est automatiquement
// redirigée vers un espace séparé ("visitor__..."), jamais mélangé aux données réelles de l'appareil.
function LSKEY(base){ return IS_VISITOR ? "visitor__"+base : base; }
function clearVisitorStorage(){
  try{
    Object.keys(localStorage).forEach(k=>{ if(k.startsWith("visitor__") || k===LS_VISITOR_SESSION) localStorage.removeItem(k); });
  }catch(e){}
  try{ indexedDB.deleteDatabase("bdcollection_db_visitor"); }catch(e){}
}

/* ================================================================

function nextParaId(){
  // Même logique que nextUserNum : un simple horodatage suffit presque toujours à distinguer deux
  // objets ajoutés sur deux appareils différents, mais on se protège du cas (rare) où deux ajouts
  // tomberaient sur la même milliseconde, ce qui ferait passer par erreur deux objets distincts
  // pour un doublon lors de la fusion d'une sauvegarde (et en perdrait un silencieusement).
  const used = new Set([
    ...parabdItems.map(p=>p.id),
    ...parabdTrash.map(p=>p.id)
  ]);
  let n = Date.now();
  while(used.has(n)) n++;
  return n;
}

function normalizeSoldItem(s){
  return {
    num: s.num, displayNum: s.displayNum ?? null,
    serie: s.serie, titre: s.titre, tome: s.tome, format: s.format,
    eo: !!s.eo, annee: s.annee ?? null, editeur: s.editeur ?? null, etat: s.etat ?? null,
    cout: s.cout ?? null, cote: s.cote ?? null, commentaire: s.commentaire ?? "",
    addedAt: s.addedAt ?? null,
    prixVente: s.prixVente ?? null, dateVente: s.dateVente ?? null, lieuVente: s.lieuVente ?? "",
    soldAt: s.soldAt ?? null
  };
}

function loadSold(){ try{ return (JSON.parse(localStorage.getItem(LSKEY(LS_SOLD))) || []).map(normalizeSoldItem); }catch(e){ return []; } }
function saveSold(){ try{ localStorage.setItem(LSKEY(LS_SOLD), JSON.stringify(soldItems)); }catch(e){} }
let soldItems = loadSold();
function markAsSold(num, prixVente, dateVente, lieuVente){
  const album = ALBUMS.find(a=>a.exemplaires.some(e=>e.num===num));
  const ex = album && album.exemplaires.find(e=>e.num===num);
  if(!album || !ex) return;
  soldItems.push({
    num, displayNum: ex.displayNum ?? null,
    serie: album.serie, titre: album.titre, tome: album.tome, format: album.format,
    eo: ex.eo, annee: ex.annee, editeur: ex.editeur, etat: ex.etat, cout: ex.cout, cote: ex.cote, commentaire: ex.commentaire,
    addedAt: ex.addedAt ?? null,
    prixVente, dateVente, lieuVente: lieuVente || "",
    soldAt: new Date().toISOString()
  });
  saveSold();
  removeForSale(num); // une BD effectivement vendue n'est plus "en vente"
  userAdded = userAdded.filter(r=>r.num!==num);
  if(num < USER_ID_BASE){
    deletedNums.add(num);
    saveDeleted();
  }
  saveAdded(userAdded);
  refreshDerived();
}
function restoreSoldItem(num){
  const idx = soldItems.findIndex(s=>s.num===num);
  if(idx<0) return;
  const snapshot = soldItems[idx];
  soldItems.splice(idx,1);
  saveSold();
  if(num < USER_ID_BASE){
    // BD de base : on retire juste le masquage, l'original réapparaît tel quel depuis RAW
    // (comme pour la Corbeille, une éventuelle modification antérieure à la vente n'est pas restaurée)
    deletedNums.delete(num);
    saveDeleted();
    userAdded = userAdded.filter(r=>r.num!==num);
  } else {
    userAdded.push({
      num, serie:snapshot.serie, titre:snapshot.titre, tome:snapshot.tome, format:snapshot.format,
      eo:snapshot.eo, annee:snapshot.annee, editeur:snapshot.editeur, etat:snapshot.etat,
      cout:snapshot.cout, vente:null, cote:snapshot.cote, commentaire:snapshot.commentaire,
      displayNum: snapshot.displayNum || nextDisplayNum(), addedAt: snapshot.addedAt ?? null, owned:true
    });
  }
  saveAdded(userAdded);
  refreshDerived();
}

// Renomme une catégorie (ou une collection) pour TOUS les objets Para-BD concernés d'un coup —
// il ne s'agit pas d'une entité à part, juste d'un champ texte partagé par plusieurs objets.
function renameParaCategorie(serie, oldName, newName){
  if(!newName || newName === oldName) return;
  parabdItems.forEach(p=>{ if(p.serie===serie && p.categorie===oldName) p.categorie = newName; });
  saveParabd();
  if(parabdState.categorie === oldName) parabdState.categorie = newName;
  refreshDerived();
}
function renameParaCollection(serie, categorie, oldName, newName){
  if(!newName || newName === oldName) return;
  parabdItems.forEach(p=>{ if(p.serie===serie && p.categorie===categorie && p.collection===oldName) p.collection = newName; });
  saveParabd();
  if(parabdState.collection === oldName) parabdState.collection = newName;
  refreshDerived();
}
function moveParaItem(id, destSerie, destCategorie, destCollection, withDeletion){
  const p = parabdItems.find(x=>x.id===id);
  if(!p) return;
  const oldPath = [p.serie, p.categorie, p.collection].filter(Boolean).join(" › ");
  const newPath = [destSerie, destCategorie, destCollection].filter(Boolean).join(" › ");
  const moveRecord = { date: new Date().toISOString(), from: oldPath, to: newPath, withDeletion };
  if(withDeletion){
    p.serie = destSerie; p.categorie = destCategorie; p.collection = destCollection || null;
    p.deplacements = [...(p.deplacements||[]), moveRecord];
    saveParabd();
    refreshDerived();
    return id; // reste le même objet
  }
  // Sans suppression : une copie apparaît à la destination, l'original reste inchangé à sa place.
  const newId = nextParaId();
  const copy = { ...p, id:newId, serie:destSerie, categorie:destCategorie, collection: destCollection || null, deplacements:[...(p.deplacements||[]), moveRecord], addedAt:new Date().toISOString() };
  parabdItems.push(copy);
  saveParabd();
  const oldPhotos = PHOTOS["para"+p.id] || [];
  if(oldPhotos.length){
    PHOTOS["para"+newId] = [...oldPhotos];
    idbSavePhotosFor("para"+newId);
  }
  refreshDerived();
  return newId;
}

let PHOTOS = {};                   // { "ex<num>": ["dataURL compressé", ...] } — miroir en mémoire d'IndexedDB

// --- IndexedDB : une seule table clé/valeur (clé = "ex<num>", valeur = tableau de dataURL) ---
const IDB_NAME = IS_VISITOR ? "bdcollection_db_visitor" : "bdcollection_db";
const IDB_STORE = "photos";
let idbPromise = null;
function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB indisponible")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbPromise;
}
async function idbLoadAllPhotos(){
  try{
    const db = await openIDB();
    return await new Promise((resolve, reject)=>{
      const store = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE);
      const out = {};
      const cursorReq = store.openCursor();
      cursorReq.onsuccess = e=>{
        const cur = e.target.result;
        if(cur){ out[cur.key] = cur.value; cur.continue(); }
        else resolve(out);
      };
      cursorReq.onerror = ()=> reject(cursorReq.error);
    });
  }catch(e){ return {}; }
}
async function idbSavePhotosFor(key){
  try{
    const db = await openIDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(PHOTOS[key] || [], key);
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ /* silencieux : le stockage restera en mémoire pour cette session */ }
}

// --- Jauge d'espace de stockage (photos) ---
function currentPhotoCount(){ return Object.values(PHOTOS).reduce((s,arr)=>s+arr.length,0); }
function currentPhotoBytesEstimate(){
  let total = 0;
  Object.values(PHOTOS).forEach(arr=> arr.forEach(src=>{ total += Math.round(src.length*0.75); }));
  return total;
}
async function updateStorageGauge(){
  const el = document.getElementById("storageGauge");
  if(!el) return;
  let usage = 0, quota = 0, estimateAvailable = false;
  if(navigator.storage && navigator.storage.estimate){
    try{ const est = await navigator.storage.estimate(); usage = est.usage||0; quota = est.quota||0; estimateAvailable = quota>0; }catch(e){}
  }
  const photoCount = currentPhotoCount();
  const photoBytes = currentPhotoBytesEstimate();
  const avgPhotoBytes = photoCount>0 ? photoBytes/photoCount : 170*1024; // hypothèse ~170 Ko tant qu'aucune photo n'existe
  const fmtMo = b => (b/1048576).toFixed(0);
  if(!estimateAvailable){
    el.innerHTML = `<p style="margin:0;">${photoCount} photo${photoCount>1?"s":""} stockée${photoCount>1?"s":""} (~${fmtMo(photoBytes)} Mo). Estimation de l'espace disponible non fournie par ce navigateur.</p>`;
    return;
  }
  const pct = Math.min(100, (usage/quota)*100);
  const remainingPhotos = Math.max(0, Math.floor((quota-usage)/avgPhotoBytes));
  el.innerHTML = `
    <div class="bar-label"><span>${fmtMo(usage)} Mo utilisés</span><span class="mono">${fmtMo(quota)} Mo disponibles sur l'appareil</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
    <p style="margin:8px 0 0;">${photoCount} photo${photoCount>1?"s":""} stockée${photoCount>1?"s":""} · encore environ <strong>${remainingPhotos.toLocaleString("fr-FR")}</strong> photos possibles à ce rythme.</p>
  `;
}
// --- Compression d'image (avant stockage) : redimensionne + réencode en JPEG ---
function compressImage(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================================================================
   COMPATIBILITÉ — garantit que les sauvegardes exportées restent
   importables même si le code évolue plus tard (nouvel onglet, nouveau
   champ, etc.). Deux règles :
   1. normalizeRow() accepte aussi bien une ligne RAW (tableau positionnel,
      utilisé uniquement pour les 150 BD de base codées en dur) qu'un objet
      nommé (BD ajoutée par l'utilisateur ou réimportée) — un champ manquant
      prend une valeur par défaut au lieu de décaler les autres champs.
   2. Les BD ajoutées par l'utilisateur reçoivent un identifiant "num" dans
      une plage réservée (100000+), totalement séparée de celle des BD de
      base (1-999). Même si la liste de base grandit dans le futur, aucune
      collision n'est possible avec une BD déjà ajoutée par l'utilisateur.
   ================================================================ */
const SCHEMA_VERSION = 1;
const APP_VERSION = "1.3.0"; // format X.Y.Z : Z +1 à chaque mise à jour ; à Z=40, Y +1 et Z revient à 0 (ex. 1.2.40 → 1.3.0)
const APP_VERSION_DATE = "22/07/2026"; // date de cette version, au format JJ/MM/AAAA — à mettre à jour à chaque changement
const USER_ID_BASE = 100000;
function normalizeRow(r){
  if(Array.isArray(r)){
    const [num, serie, titre, tome, format, eo, annee, editeur, etat, cote, commentaire, owned] = r;
    return { num, serie, titre, tome, format, eo:!!eo, annee, editeur, etat, cout:null, vente:null, cote, commentaire, owned, modifiedAt:null, displayNum:null, addedAt:null };
  }
  return {
    num: r.num,
    serie: r.serie, titre: r.titre,
    tome: r.tome ?? "Unique", format: r.format ?? "Classique",
    eo: !!r.eo, annee: r.annee ?? null, editeur: r.editeur ?? null, etat: r.etat ?? null,
    cout: r.cout ?? null, vente: r.vente ?? null, cote: r.cote ?? "Non coté",
    commentaire: r.commentaire ?? "", owned: r.owned !== false, modifiedAt: r.modifiedAt ?? null,
    displayNum: r.displayNum ?? null, addedAt: r.addedAt ?? null
  };
}
function nextUserNum(){
  // Horodatage (comme nextParaId) plutôt qu'un compteur séquentiel : deux appareils différents
  // qui ajoutent chacun des BD indépendamment ne génèrent quasiment jamais le même identifiant,
  // ce qui évite qu'une fusion de sauvegardes (import) ne fasse passer par erreur deux BD
  // distinctes pour un doublon (et donc en perde une silencieusement).
  const used = new Set([
    ...userAdded.map(r=>r.num),
    ...bdTrash.map(r=>r.num)
  ]);
  let n = Date.now();
  while(used.has(n)) n++; // garde-fou si deux ajouts tombent dans la même milliseconde
  return n;
}
// Numéro affiché (façon numéro de fiche/catalogue), distinct de num (l'id interne anti-collision ci-dessus).
// Continue simplement après le dernier numéro déjà utilisé, en comptant les 150 BD de base ET les BD déjà ajoutées
// (y compris celles passées à la corbeille, pour qu'un numéro attribué une fois ne soit jamais réutilisé).
function nextDisplayNum(){
  const used = RAW.map(r=>r[0]);
  userAdded.forEach(r=>{ if(r.displayNum) used.push(r.displayNum); });
  bdTrash.forEach(r=>{ if(r.displayNum) used.push(r.displayNum); });
  return (used.length ? Math.max(...used) : 0) + 1;
}
// Migration ponctuelle : donne un numéro définitif aux BD ajoutées avant l'existence de displayNum
// (celles qui affichaient un "＋" à la place d'un numéro). Ne s'exécute qu'une fois par BD concernée.
function migrateDisplayNums(){
  const toMigrate = userAdded.filter(r=>!r.displayNum).sort((a,b)=>a.num-b.num);
  if(!toMigrate.length) return;
  toMigrate.forEach(r=>{ r.displayNum = nextDisplayNum(); });
  saveAdded(userAdded);
}

/* ================================================================
   MODÈLE — regroupe les lignes en albums (fusion automatique des doublons)
   ================================================================ */
function buildAlbums(rawRows, userRows){
  const map = new Map();
  const order = [];
  let aid = 0;
  function processRow(row, isRaw){
    const { num, serie, titre, tome, format, eo, annee, editeur, etat, cote, commentaire, owned, modifiedAt, displayNum, addedAt } = row;
    if(isRaw && deletedNums.has(num)) return; // BD de base supprimée ou remplacée par une version modifiée
    // Pour une BD de base, coût/vente ne sont plus dans le code : ils viennent uniquement de baseFinances
    // (rempli une fois via le fichier de migration), jamais du fichier public.
    const fin = isRaw ? (baseFinances[num] || {}) : row;
    const cout = fin.cout ?? null, vente = fin.vente ?? null;
    const key = [serie,titre,tome,format].join("|||");
    if(!map.has(key)){
      map.set(key, { aid: aid++, serie, titre, tome, format, owned:false, exemplaires: [] });
      order.push(key);
    }
    const album = map.get(key);
    if(owned){
      album.owned = true;
      album.exemplaires.push({ key:"ex"+num, num, eo, annee, editeur, etat, cout, vente, cote, commentaire, modifiedAt, displayNum, addedAt, forSale: getForSale(num) });
    }
  }
  rawRows.map(normalizeRow).forEach(row=>processRow(row, true));
  userRows.map(normalizeRow).forEach(row=>processRow(row, false));
  return order.map(k=>map.get(k));
}

let ALBUMS = [], OWNED = [], SERIES = [], SERIE_COUNTS = [];
function refreshDerived(){
  ALBUMS = buildAlbums(RAW, userAdded);
  OWNED = ALBUMS.filter(a=>a.owned);
  SERIES = [...new Set(OWNED.map(a=>a.serie))];
  SERIE_COUNTS = SERIES.map(s=>({
    serie:s,
    count: OWNED.filter(a=>a.serie===s).reduce((sum,a)=>sum+a.exemplaires.length,0)
  })).sort((a,b)=>b.count-a.count);
}
refreshDerived();

function saveBdTrash(){ try{ localStorage.setItem(LSKEY(LS_BD_TRASH), JSON.stringify(bdTrash)); }catch(e){} }

  if(!hasContent) return false;

function deleteExemplaire(num){
  // capture un instantané complet (album + exemplaire) avant suppression, qu'il vienne de la base ou d'un ajout
  const album = ALBUMS.find(a=>a.exemplaires.some(e=>e.num===num));
  const ex = album && album.exemplaires.find(e=>e.num===num);
  if(album && ex){
    bdTrash.push({
      num, serie:album.serie, titre:album.titre, tome:album.tome, format:album.format,
      eo:ex.eo, annee:ex.annee, editeur:ex.editeur, etat:ex.etat, cout:ex.cout, vente:ex.vente, cote:ex.cote, commentaire:ex.commentaire,
      displayNum: ex.displayNum ?? null, addedAt: ex.addedAt ?? null,
      deletedAt: new Date().toISOString()
    });
    saveBdTrash();
  }
  removeForSale(num);
  userAdded = userAdded.filter(r=>r.num!==num);
  if(num < USER_ID_BASE){
    deletedNums.add(num);
    saveDeleted();
  }
  saveAdded(userAdded);
  refreshDerived();
}
function trashedRows(){
  return bdTrash.slice();
}
function restoreDeleted(num){
  const idx = bdTrash.findIndex(r=>r.num===num);
  const snapshot = idx>=0 ? bdTrash[idx] : null;
  if(idx>=0){ bdTrash.splice(idx,1); saveBdTrash(); }
  if(num < USER_ID_BASE){
    // BD de base : on retire juste le masquage, l'original réapparaît tel quel depuis RAW
    deletedNums.delete(num);
    saveDeleted();
    userAdded = userAdded.filter(r=>r.num!==num); // enlève une éventuelle version modifiée, pour retrouver l'originale telle quelle
  } else if(snapshot){
    // BD ajoutée par l'utilisateur : elle n'existe nulle part ailleurs, on la recrée depuis l'instantané
    userAdded.push({
      num, serie:snapshot.serie, titre:snapshot.titre, tome:snapshot.tome, format:snapshot.format,
      eo:snapshot.eo, annee:snapshot.annee, editeur:snapshot.editeur, etat:snapshot.etat,
      cout:snapshot.cout, vente:snapshot.vente, cote:snapshot.cote, commentaire:snapshot.commentaire,
      displayNum: snapshot.displayNum || nextDisplayNum(), // au cas où elle aurait été supprimée avant l'existence de ce numéro
      addedAt: snapshot.addedAt ?? null,
      owned:true
    });
  }
  saveAdded(userAdded);
  refreshDerived();
}
async function purgeBdTrash(num){
  const idx = bdTrash.findIndex(r=>r.num===num);
  if(idx>=0){ bdTrash.splice(idx,1); saveBdTrash(); }
  const key = "ex"+num;
  if(PHOTOS[key]){ PHOTOS[key] = []; await idbSavePhotosFor(key); }
  // Pour une BD de base, le masquage (deletedNums) reste : elle continue de ne pas apparaître dans la collection.
  // Pour une BD ajoutée, elle n'existait déjà plus ailleurs : la sortir de la corbeille suffit à l'effacer pour de bon.
}
function editExemplaire(num, fields){
  const withTimestamp = { ...fields, modifiedAt: new Date().toISOString() };
  if(num >= USER_ID_BASE){
    const idx = userAdded.findIndex(r=>r.num===num);
    if(idx>=0) userAdded[idx] = { ...withTimestamp, num, owned:true, displayNum: userAdded[idx].displayNum ?? null, addedAt: userAdded[idx].addedAt ?? null };
  } else {
    deletedNums.add(num); saveDeleted();
    userAdded = userAdded.filter(r=>r.num!==num);
    userAdded.push({ ...withTimestamp, num, owned:true });
  }
  saveAdded(userAdded);
  refreshDerived();
}

// --- Visionneuse plein écran des photos, avec balayage pour passer d'une photo à l'autre ---
let lightboxPhotos = [];
let lightboxIndex = 0;
function openLightbox(photos, startIndex){
  lightboxPhotos = photos;
  lightboxIndex = startIndex;
  renderLightbox();
}
function touchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}
function renderLightbox(){
  const overlay = document.getElementById("lightboxOverlay");
  const dots = lightboxPhotos.length>1
    ? `<div class="lightbox-dots">${lightboxPhotos.map((_,i)=>`<span class="lightbox-dot ${i===lightboxIndex?'active':''}"></span>`).join("")}</div>`
    : "";
  overlay.innerHTML = `
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    ${lightboxPhotos.length>1 ? `<div class="lightbox-counter">${lightboxIndex+1} / ${lightboxPhotos.length}</div>` : ""}
    <img class="lightbox-img" id="lightboxImg" src="${lightboxPhotos[lightboxIndex]}">
    ${dots}
  `;
  overlay.classList.add("open");
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);

  const img = document.getElementById("lightboxImg");
  let scale = 1, tx = 0, ty = 0;
  let pinchStartDist = null, pinchStartScale = 1;
  let panStart = null, panStartTX = 0, panStartTY = 0;
  let swipeStartX = null;
  let lastTapAt = 0;

  function applyTransform(withTransition){
    img.style.transition = withTransition ? "transform 0.2s ease" : "none";
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  overlay.ontouchstart = e=>{
    if(e.touches.length===2){
      pinchStartDist = touchDist(e.touches);
      pinchStartScale = scale;
      swipeStartX = null;
    } else if(e.touches.length===1){
      const now = Date.now();
      if(now - lastTapAt < 300){
        // double-tap : bascule zoom avant/arrière
        scale = scale>1 ? 1 : 2.5;
        tx = 0; ty = 0;
        applyTransform(true);
      }
      lastTapAt = now;
      if(scale>1){
        panStart = { x:e.touches[0].clientX, y:e.touches[0].clientY };
        panStartTX = tx; panStartTY = ty;
      } else {
        swipeStartX = e.touches[0].clientX;
      }
    }
  };
  overlay.ontouchmove = e=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault();
      const dist = touchDist(e.touches);
      scale = Math.min(4, Math.max(1, pinchStartScale * (dist/pinchStartDist)));
      applyTransform(false);
    } else if(e.touches.length===1 && scale>1 && panStart){
      e.preventDefault();
      tx = panStartTX + (e.touches[0].clientX - panStart.x);
      ty = panStartTY + (e.touches[0].clientY - panStart.y);
      applyTransform(false);
    }
  };
  overlay.ontouchend = e=>{
    pinchStartDist = null;
    panStart = null;
    if(scale<=1 && swipeStartX!==null && e.changedTouches.length){
      const diff = e.changedTouches[0].clientX - swipeStartX;
      if(Math.abs(diff) > 40){
        if(diff < 0 && lightboxIndex < lightboxPhotos.length-1){ lightboxIndex++; renderLightbox(); }
        else if(diff > 0 && lightboxIndex > 0){ lightboxIndex--; renderLightbox(); }
      }
    }
    swipeStartX = null;
  };
}
function closeLightbox(){
  document.getElementById("lightboxOverlay").classList.remove("open");
}

function ageFromAnnee(annee){
  const y = parseInt((annee||"").toString(), 10);
  if(isNaN(y)) return "";
  const age = new Date().getFullYear() - y;
  if(age < 0) return ""; // année dans le futur (erreur de saisie probable) : on n'affiche rien plutôt qu'un âge négatif

function parseCote(c){
  if(!c) return null;
  if(/non\s*c[oô]t/i.test(c)) return null;
  const nums = (c.match(/\d+/g)||[]).map(Number);
  if(!nums.length) return null;
  return nums.reduce((a,b)=>a+b,0)/nums.length;

// --- Recherche insensible aux accents/majuscules (utilisée par les suggestions du formulaire "Ajouter") ---
function normalizeText(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['’‘´`]/g,"").toLowerCase().trim(); }

// --- Distance de Levenshtein (nombre minimal de modifications pour passer d'une chaîne à l'autre) ---
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const d = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      d[i][j] = a[i-1]===b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j], d[i][j-1], d[i-1][j-1]);
    }
  }
  return d[m][n];
}
// Cherche une catégorie déjà existante (pour cette série) proche de celle tapée.
// Retourne {match, exact:true} pour une correspondance accents/majuscules près, {match, exact:false} pour une orthographe proche (faute de frappe probable), ou null si rien de proche.
function findSimilarIn(existing, typed){
  const normTyped = normalizeText(typed);
  const exact = existing.find(c=>normalizeText(c)===normTyped);
  if(exact) return { match:exact, exact:true };
  let best = null, bestDist = Infinity;
  existing.forEach(c=>{
    const d = levenshtein(normTyped, normalizeText(c));
    if(d < bestDist){ bestDist = d; best = c; }
  });
  if(!best) return null;
  const threshold = Math.max(1, Math.floor(Math.max(normTyped.length, normalizeText(best).length) * 0.3));
  if(bestDist>0 && bestDist<=threshold) return { match:best, exact:false };
  return null;
}
function findSimilarCategory(serie, typed){
  const existing = distinctValues(paraItemsFor(serie).map(p=>p.categorie));
  return findSimilarIn(existing, typed);
}
function findSimilarCollection(serie, categorie, typed){
  const existing = distinctValues(parabdItems.filter(p=>p.serie===serie && p.categorie===categorie).map(p=>p.collection));
  return findSimilarIn(existing, typed);
}
function distinctValues(list){ return [...new Set(list.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")); }
function distinctSeries(){ return distinctValues(OWNED.map(a=>a.serie)); }
function distinctTitres(){ return distinctValues(OWNED.map(a=>a.titre)); }
function distinctFormats(){ return distinctValues(OWNED.map(a=>a.format)); }
// Regroupe les variantes d'un même format (ex. "Classique - 14b", "Classique - 1C" → "Classique") pour ne pas les lister séparément.
function formatBase(format){ return (format||"").split(" - ")[0].trim(); }
function distinctFormatBases(serie){
  const source = serie ? OWNED.filter(a=>a.serie===serie) : OWNED;
  return [...new Set(source.map(a=>formatBase(a.format)))].sort((a,b)=>a.localeCompare(b,"fr"));
}
function distinctEditeurs(){ return distinctValues(OWNED.flatMap(a=>a.exemplaires.map(e=>e.editeur))); }
function distinctLieuxVente(){ return distinctValues(soldItems.map(s=>s.lieuVente)); }

// --- Helpers Para-BD ---
function distinctParaSeries(){ return distinctValues(parabdItems.map(p=>p.serie)).sort((a,b)=>a.localeCompare(b,"fr")); }
function paraItemsFor(serie){ return parabdItems.filter(p=>p.serie===serie); }
function distinctParaCategories(serie){ return distinctValues(paraItemsFor(serie).map(p=>p.categorie)).sort((a,b)=>a.localeCompare(b,"fr")); }
function paraItemsForCategorie(serie,categorie){ return parabdItems.filter(p=>p.serie===serie && p.categorie===categorie); }
function distinctParaEditeurs(){ return distinctValues(parabdItems.map(p=>p.editeur)); }

// Attache une suggestion accent-insensible à un champ texte, sans passer par un re-rendu complet (le focus/curseur ne bougent pas)
function attachCombo(inputId, listId, getOptions){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  function refresh(){
    const q = normalizeText(input.value);
    if(!q){ list.innerHTML=""; return; }
    const matches = getOptions().filter(o=>normalizeText(o).includes(q)).slice(0,6);
    list.innerHTML = matches.map(o=>`<div class="combo-item" data-value="${o.replace(/"/g,'&quot;')}">${o}</div>`).join("");
    list.querySelectorAll(".combo-item").forEach(el=>{
      el.addEventListener("mousedown", ev=>{
        ev.preventDefault(); // se déclenche avant le blur de l'input, pour ne pas fermer la liste trop tôt
        input.value = el.dataset.value;
        list.innerHTML = "";
      });
    });
  }
  input.addEventListener("input", refresh);
  input.addEventListener("focus", refresh);
  input.addEventListener("blur", ()=> setTimeout(()=>{ list.innerHTML=""; }, 150));
}

function renderCoverGrid(){
  const seriesAlpha = [...new Set(OWNED.map(a=>a.serie))].sort((a,b)=>a.localeCompare(b,"fr"));
  return seriesAlpha.map(s=>{
    const albums = OWNED.filter(a=>a.serie===s).slice().sort((a,b)=>{
      const f = formatBase(a.format).localeCompare(formatBase(b.format),"fr"); if(f) return f;
      const na = parseInt(a.tome,10), nb = parseInt(b.tome,10);
      const aNum = !isNaN(na), bNum = !isNaN(nb);
      if(aNum && bNum) return na-nb;
      if(aNum) return -1;
      if(bNum) return 1;
      return a.titre.localeCompare(b.titre,"fr");
    });
    const cards = albums.map(a=>{
      const ex = a.exemplaires[0];
      const photo = photoForEx(ex);
      const thumb = photo
        ? `<img src="${photo}">`
        : `<span class="ph-icon">＋</span>`;
      return `
        <div class="cover-cell" data-detail="${a.aid}">
          <div class="cover-img">${thumb}</div>
          <div class="cover-caption">${a.titre}</div>
        </div>
      `;
    }).join("");
    return `<p class="section-title">${s}</p><div class="cover-grid">${cards}</div>`;
  }).join("");
}

function renderShelf(){

    return `<div class="spine" style="width:${w}px" data-serie="${s.serie}" title="${s.serie}"><span class="label">${s.serie}</span></div>`;

    : `
      <div class="card shelf-wrap">
        <div class="shelf">${spines}</div>
        <div class="shelf-floor"></div>
      </div>
    `;

  const reminder = shouldShowBackupReminder() ? `
    <div class="reminder-banner" id="backupReminder">
      <span class="reminder-icon">⏱</span>
      <span class="reminder-text">${getLastExportAt() ? "Ça fait plus d'un mois que tu n'as pas exporté de sauvegarde." : "Tu n'as encore jamais exporté de sauvegarde de tes ajouts et photos."}</span>
      <button class="reminder-btn" id="reminderExportBtn">Exporter</button>

  return `

  `;
}

/* ================================================================

function renderCollection(){
  let list = OWNED.slice();
  if(state.filterSerie) list = list.filter(a=>a.serie===state.filterSerie);
  if(state.filterFormat) list = list.filter(a=>formatBase(a.format)===state.filterFormat);
  if(state.filterEtat) list = list.filter(a=>a.exemplaires.some(e=>e.etat===state.filterEtat));
  if(state.query){
    const q = normalizeText(state.query);
    list = list.filter(a=>{
      const inEditeurs = a.exemplaires.some(e=>normalizeText(e.editeur||"").includes(q));
      return normalizeText(a.titre).includes(q) || normalizeText(a.serie).includes(q) || inEditeurs;
    });
  }
  if(state.sort==="num") list.sort((a,b)=>a.exemplaires[0].num-b.exemplaires[0].num);
  if(state.sort==="alpha") list.sort((a,b)=>a.titre.localeCompare(b.titre));
  if(state.sort==="vente") list.sort((a,b)=>albumTotalVente(b)-albumTotalVente(a));
  if(state.sort==="cote") list.sort((a,b)=>Math.max(...b.exemplaires.map(e=>parseCote(e.cote)||0)) - Math.max(...a.exemplaires.map(e=>parseCote(e.cote)||0)));
  if(state.sort==="eo") list.sort((a,b)=>(albumHasEO(b)?1:0)-(albumHasEO(a)?1:0) || a.exemplaires[0].num-b.exemplaires[0].num);
  if(state.sort==="tome") list.sort((a,b)=>{
    const s = a.serie.localeCompare(b.serie,"fr"); if(s) return s;
    const f = formatBase(a.format).localeCompare(formatBase(b.format),"fr"); if(f) return f;
    const ta = parseInt(a.tome,10), tb = parseInt(b.tome,10);
    const aNum = !isNaN(ta), bNum = !isNaN(tb);
    if(aNum && bNum) return ta-tb;
    if(aNum) return -1;
    if(bNum) return 1;
    return a.titre.localeCompare(b.titre,"fr");
  });
  if(state.sort==="parution") list.sort((a,b)=>{
    const yearOf = al => { const y = parseInt((al.exemplaires[0].annee||"").toString(),10); return isNaN(y) ? null : y; };
    const ya = yearOf(a), yb = yearOf(b);
    if(ya!==null && yb!==null) return ya-yb;
    if(ya!==null) return -1;
    if(yb!==null) return 1;
    return a.titre.localeCompare(b.titre,"fr");
  });

  const chips = ["Toutes", ...SERIE_COUNTS.map(s=>s.serie)].map(s=>{
    const active = (s==="Toutes" && !state.filterSerie) || s===state.filterSerie;
    return `<div class="chip ${active?'active':''}" data-chip="${s==='Toutes'?'':s}">${s}</div>`;
  }).join("");

  const rows = list.map(a=>{
    const multi = a.exemplaires.length>1;
    const ex = a.exemplaires[0];
    const yr = sameAnnee(a);
    const hasEO = multi ? albumHasEO(a) : ex.eo;
    const sub = multi
      ? `${a.serie} · T${a.tome} · ${yr?yr+" · ":""}${multiLabel(a.exemplaires.length)}`
      : `${a.serie} · T${a.tome} · ${ex.editeur||"Non renseigné"} · ${ex.annee||"Non renseigné"}`;
    const badge = `${hasEO?'<span class="badge eo-badge">EO</span> ':''}<span class="badge" style="background:${etatColor(ex.etat)}; color:${etatTextColor(ex.etat)};">${ex.etat||"Non renseigné"}</span>`;
    const valueDisplay = multi
      ? eur(albumTotalVente(a))
      : (!isNonCote(ex.cote) ? coteDisplay(ex.cote) : eur(ex.vente));
    return `
      <div class="card album-row" data-detail="${a.aid}">
        <div class="album-num mono">${ex.num < USER_ID_BASE ? ex.num : (ex.displayNum || "＋")}</div>
        <div class="album-main">
          <div class="album-title">${a.titre}</div>
          <div class="album-sub">${sub}</div>
        </div>
        <div class="album-right">
          ${badge}
          <div class="val-line mono">${valueDisplay}</div>
        </div>
      </div>
    `;
  }).join("") || `<div class="empty">Aucun album ne correspond à ta recherche.</div>`;

  const sortOptions = {num:"Numéro", alpha:"Alphabétique", vente:"Valeur", cote:"Côte", eo:"EO d'abord", tome:"Tome", parution:"Ordre de parution"};
  const sortOpts = Object.keys(sortOptions).map(k=>`<option value="${k}" ${state.sort===k?"selected":""}>${sortOptions[k]}</option>`).join("");
  const formatOpts = distinctFormatBases(state.filterSerie).map(f=>`<option value="${f}" ${state.filterFormat===f?"selected":""}>${f}</option>`).join("");
  const etatOpts = ETAT_OPTIONS.map(e=>`<option value="${e}" ${state.filterEtat===e?"selected":""}>${e}</option>`).join("");

  return `
    <div class="search-wrap">
      <input class="search-input" id="searchBox" placeholder="Chercher un titre, une série, un éditeur…" value="${state.query}">
      ${state.query ? `<button class="clear-search" id="clearSearch" aria-label="Effacer">×</button>` : ""}
    </div>
    <div class="chip-row">${chips}</div>
    <div class="count-line">${list.length} album${list.length>1?'s':''}</div>
    <div class="row-between" style="gap:8px; margin-bottom:8px;">
      <select class="sort-select" id="formatFilterSelect" style="flex:1; min-width:0;">
        <option value="">Tous les formats</option>
        ${formatOpts}
      </select>
      <select class="sort-select" id="etatFilterSelect" style="flex:1; min-width:0;">
        <option value="">Tous les états</option>
        ${etatOpts}
      </select>
    </div>
    <div style="margin-bottom:14px;">
      <select class="sort-select" id="sortSelect" style="width:100%;">${sortOpts}</select>
    </div>
    ${rows}
  `;
}

function insuranceFilename(ext){
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,"0");
  const mm = String(now.getMonth()+1).padStart(2,"0");
  const yy = String(now.getFullYear()).slice(2);
  return `fiche_assurance_bd_${dd}-${mm}-${yy}_v${APP_VERSION}.${ext}`;
}
function csvEscape(v){
  const s = String(v ?? "");
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function chooseInsuranceFormat(){
  showChoice(
    "Sous quelle forme veux-tu la fiche assurance ?",
    "PDF", "Excel (CSV)",
    openInsuranceDocPDF,
    exportInsuranceCSV
  );
}
function exportInsuranceCSV(){
  const totalCout = OWNED.reduce((s,a)=>s+albumTotalCout(a),0);
  const totalVente = OWNED.reduce((s,a)=>s+albumTotalVente(a),0);
  const totalCote = OWNED.flatMap(a=>a.exemplaires).map(e=>parseCote(e.cote)).filter(v=>v!==null).reduce((s,v)=>s+v,0);
  const lines = [];
  lines.push(csvEscape("Fiche d'assurance - Collection de Bandes Dessinées"));
  lines.push(["Propriétaire","Antoine BILLARD"].map(csvEscape).join(";"));
  lines.push(["Généré le", formatDateTime(new Date().toISOString())].map(csvEscape).join(";"));
  lines.push(["Coût total", totalCout].map(csvEscape).join(";"));
  lines.push(["Valeur de vente estimée", totalVente].map(csvEscape).join(";"));
  lines.push(["Côte BDM/BD Gest", totalCote].map(csvEscape).join(";"));
  lines.push("");
  lines.push(["Série","Titre","Tome","Format","EO","État","Valeur","Côte"].map(csvEscape).join(";"));
  OWNED.forEach(a=>a.exemplaires.forEach(ex=>{
    lines.push([a.serie, a.titre, a.tome, a.format, ex.eo?"Oui":"Non", ex.etat||"", ex.vente??"", ex.cote||""].map(csvEscape).join(";"));
  }));
  if(parabdItems.length){
    lines.push("");
    lines.push(["Série","Catégorie","Objet","État","Coût"].map(csvEscape).join(";"));
    parabdItems.forEach(p=>{
      lines.push([p.serie, p.categorie, p.objet||"", p.etat||"", p.cout??""].map(csvEscape).join(";"));
    });
  }
  const blob = new Blob(["\ufeff"+lines.join("\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = insuranceFilename("csv");
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Construit les lignes d'un tableau UNIQUE, avec une ligne d'en-tête par série intercalée entre les groupes.
// Un seul <table> (plutôt que plusieurs éléments <table> séparés) est plus robuste à la pagination

function buildGroupedBDRows(rowBuilder, colspan){
  return ownedBySerieSorted().map(({serie, albums})=>{
    const groupHeader = `<tr class="serie-group"><td colspan="${colspan}">${serie}</td></tr>`;
    const rows = albums.flatMap(a=>a.exemplaires.map(ex=>rowBuilder(a,ex))).join("");
    return groupHeader + rows;
  }).join("");
}
function ownedBySerieSorted(){
  const seriesAlpha = [...new Set(OWNED.map(a=>a.serie))].sort((a,b)=>a.localeCompare(b,"fr"));
  return seriesAlpha.map(s=>{
    const albums = OWNED.filter(a=>a.serie===s).slice().sort((a,b)=>{
      const f = formatBase(a.format).localeCompare(formatBase(b.format),"fr"); if(f) return f;
      const na = parseInt(a.tome,10), nb = parseInt(b.tome,10);
      const aNum = !isNaN(na), bNum = !isNaN(nb);
      if(aNum && bNum) return na-nb;
      if(aNum) return -1;
      if(bNum) return 1;
      return a.titre.localeCompare(b.titre,"fr");
    });
    return { serie: s, albums };
  });
}

// --- Compression des sauvegardes (gzip natif du navigateur) : réduit surtout la partie texte,
// les photos étant déjà compressées en JPEG, le gain sur elles reste modeste. Se dégrade en
// export non-compressé sur les navigateurs trop anciens pour ne jamais bloquer la sauvegarde.
async function compressText(text){
  if(!window.CompressionStream) return null;
  try{
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
    return await new Response(stream).arrayBuffer();
  }catch(e){ return null; }
}
async function decompressToText(arrayBuffer){
  if(!window.DecompressionStream){
    const err = new Error("DECOMPRESSION_UNSUPPORTED");
    err.code = "DECOMPRESSION_UNSUPPORTED";
    throw err;
  }
  const stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function looksGzip(arrayBuffer){
  if(arrayBuffer.byteLength<2) return false;
  const bytes = new Uint8Array(arrayBuffer.slice(0,2));
  return bytes[0]===0x1f && bytes[1]===0x8b;
}

/* ================================================================
   EXPORT DES PHOTOS SEULES — fichier .zip généré entièrement en JS,
   sans bibliothèque externe (méthode "store" : pas de recompression,
   les photos étant déjà des JPEG compressés, ça n'apporterait rien).
   ================================================================ */
const CRC_TABLE = (()=>{
  const table = [];
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    table[n] = c>>>0;
  }
  return table;
})();
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = (crc>>>8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function u16(n){ return new Uint8Array([n & 0xFF, (n>>8) & 0xFF]); }
function u32(n){ return new Uint8Array([n & 0xFF, (n>>8) & 0xFF, (n>>16) & 0xFF, (n>>24) & 0xFF]); }
function concatBytes(arrays){
  let total = 0; arrays.forEach(a=>total+=a.length);
  const result = new Uint8Array(total);
  let offset=0; arrays.forEach(a=>{ result.set(a, offset); offset+=a.length; });
  return result;
}
function dosDateTime(date){
  const dosTime = ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | (Math.floor(date.getSeconds()/2) & 0x1F);
  const dosDate = (((date.getFullYear()-1980) & 0x7F) << 9) | (((date.getMonth()+1) & 0xF) << 5) | (date.getDate() & 0x1F);
  return { dosTime, dosDate };
}
function dataUrlToBytes(dataUrl){
  const comma = dataUrl.indexOf(",");
  const bin = atob(dataUrl.slice(comma+1));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
// Construit un .zip valide (format "store", non compressé) à partir d'une liste { name, bytes }.
function buildZip(entries){
  const { dosTime, dosDate } = dosDateTime(new Date());
  const localChunks = [];
  const centralChunks = [];
  let offset = 0;
  entries.forEach(({name, bytes})=>{
    const nameBytes = new TextEncoder().encode(name);
    const crc = crc32(bytes);
    const size = bytes.length;
    const local = concatBytes([
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), nameBytes
    ]);
    localChunks.push(local, bytes);
    centralChunks.push(concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0),
      u32(offset), nameBytes
    ]));
    offset += local.length + bytes.length;
  });
  const centralDirStart = offset;
  const centralDirBytes = concatBytes(centralChunks);
  const eocd = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(centralDirBytes.length), u32(centralDirStart), u16(0)
  ]);
  return new Blob([...localChunks, centralDirBytes, eocd], { type:"application/zip" });
}
function sanitizeFilename(s){
  return (s||"").replace(/[\/\\:*?"<>|]/g,"-").trim() || "sans-titre";
}
function uniqueNameFactory(){
  const used = new Set();
  return function(name){
    if(!used.has(name)){ used.add(name); return name; }
    const dot = name.lastIndexOf(".");
    const base = dot>=0 ? name.slice(0,dot) : name;
    const ext = dot>=0 ? name.slice(dot) : "";
    let i=2, candidate;
    do{ candidate = `${base} (${i})${ext}`; i++; }while(used.has(candidate));
    used.add(candidate);
    return candidate;
  };
}
function collectPhotoExportEntries(){
  const entries = [];
  const uniqueName = uniqueNameFactory();
  OWNED.forEach(a=>{
    a.exemplaires.forEach((ex,exi)=>{
      const photos = PHOTOS[ex.key] || [];
      photos.forEach((src,pi)=>{
        const folder = sanitizeFilename(a.serie);
        const base = sanitizeFilename(a.titre) + (a.tome!=="Unique" ? ` T${a.tome}` : "");
        const suffix = a.exemplaires.length>1 ? ` - exemplaire ${exi+1}` : "";
        const photoSuffix = photos.length>1 ? ` - photo ${pi+1}` : "";
        entries.push({ name: uniqueName(`BD/${folder}/${base}${suffix}${photoSuffix}.jpg`), dataUrl: src });
      });
    });
  });
  parabdItems.forEach(p=>{
    const photos = PHOTOS["para"+p.id] || [];
    photos.forEach((src,pi)=>{
      const folder = sanitizeFilename(p.serie);
      const base = sanitizeFilename(p.categorie) + (p.objet ? " - "+sanitizeFilename(p.objet) : "");
      const photoSuffix = photos.length>1 ? ` - photo ${pi+1}` : "";
      entries.push({ name: uniqueName(`Para-BD/${folder}/${base}${photoSuffix}.jpg`), dataUrl: src });
    });
  });
  return entries;
}
function estimatePhotoExportSize(entries){
  return entries.reduce((sum,e)=>{
    const comma = e.dataUrl.indexOf(",");
    return sum + Math.floor((e.dataUrl.length - comma - 1) * 0.75);
  }, 0);
}
function formatBytes(n){
  if(n < 1024) return n + " o";
  if(n < 1024*1024) return Math.round(n/1024) + " Ko";
  return (n/(1024*1024)).toFixed(1) + " Mo";
}
function estimateAllPhotosSize(){
  let total = 0;
  Object.values(PHOTOS).forEach(arr=>arr.forEach(src=>{ total += src.length; })); // approximation suffisante (longueur de la chaîne base64)
  return total;
}

   PARTAGE VISITEUR — fiche de réglages, construction d'un fichier

async function generateAndShareVisitorFile(){
  const msg = document.getElementById("visitorShareMsg");
  try{
    const minutes = Number(document.getElementById("visitorDuration").value);
    const includeComments = document.getElementById("visitorIncludeComments").checked;
    const includePhotos = document.getElementById("visitorIncludePhotos").checked;
    const expiresAt = new Date(Date.now() + minutes*60000).toISOString();

    const payload = {
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      visitorSession: { expiresAt },
      added: userAdded.map(r=>visitorRowFrom(r, includeComments)),
      deleted: [...deletedNums],
      parabd: parabdItems.map(p=>visitorParaFrom(p, includeComments)),
      photos: includePhotos ? PHOTOS : {}
      // wishlist, bdTrash, parabdTrash, baseFinances, sold : jamais inclus dans un partage visiteur
    };

    const jsonText = JSON.stringify(payload);
    const compressed = await compressText(jsonText);
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,"0");
    const mm = String(now.getMonth()+1).padStart(2,"0");
    const yy = String(now.getFullYear()).slice(2);
    const filename = compressed ? `visite_collection_bd_${dd}-${mm}-${yy}.json.gz` : `visite_collection_bd_${dd}-${mm}-${yy}.json`;
    const blob = compressed ? new Blob([compressed], { type:"application/gzip" }) : new Blob([jsonText], { type:"application/json" });

    const durationLabel = minutes===60 ? "1 heure" : `${minutes} minutes`;
    const expiresLabel = new Date(expiresAt).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
    const shareText = `Salut !\n\nJe te partage ma collection de BD (en lecture seule, le temps d'y jeter un œil) :\n\n1. Ouvre ce lien : ${location.href}\n2. Une fois l'appli ouverte, va dans l'onglet Ajouter (en bas), puis "Importer la sauvegarde"\n3. Sélectionne le fichier joint à ce message (${filename})\n4. Tu arrives automatiquement sur ma collection, en lecture seule — tu peux consulter, chercher, trier les BD et Para-BD, mais rien modifier ni ajouter\n\n⏳ Attention : cet accès expire ${durationLabel} après l'envoi, à ${expiresLabel}. Passé ce délai, l'appli redevient vide pour toi (tout sera automatiquement effacé de ton téléphone) — aucune conséquence pour moi si ça arrive, dis-le-moi juste et je t'en renvoie un.\n\nBonne visite !`;

    try{
      const file = new File([blob], filename, { type: blob.type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Ma collection de BD", text: shareText });
        if(msg) msg.textContent = "Partagé avec succès.";
        return;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === "AbortError"){
        if(msg) msg.textContent = "";
        return;
      }
      throw shareErr;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if(msg) msg.textContent = "Fichier généré et téléchargé. Envoie-le manuellement avec ce message :\n\n" + shareText;
  }catch(err){
    if(msg) msg.textContent = "Échec de la génération du partage — réessaie.";
  }
}

    `${entries.length} photo${entries.length>1?"s":""} au total, environ ${formatBytes(sizeEstimate)}. Créer et exporter cette archive ?`,
    "Exporter",
    async ()=>{
      if(msg) msg.textContent = "Préparation de l'archive photo…";
      try{
        const zipEntries = entries.map(e=>({ name:e.name, bytes:dataUrlToBytes(e.dataUrl) }));
        const blob = buildZip(zipEntries);
        const now = new Date();
        const dd = String(now.getDate()).padStart(2,"0");
        const mm = String(now.getMonth()+1).padStart(2,"0");
        const yy = String(now.getFullYear()).slice(2);
        const filename = `photos_bd_${dd}-${mm}-${yy}.zip`;

        try{
          const file = new File([blob], filename, { type:"application/zip" });
          if(navigator.canShare && navigator.canShare({ files:[file] })){
            await navigator.share({ files:[file], title:"Photos de la collection" });
            if(msg) msg.textContent = "Photos exportées avec succès.";
            return;
          }
        }catch(shareErr){
          if(shareErr && shareErr.name === "AbortError"){
            if(msg) msg.textContent = "";
            return;
          }
          throw shareErr;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        if(msg) msg.textContent = "Photos exportées avec succès.";
      }catch(err){
        if(msg) msg.textContent = "Échec de l'export des photos — réessaie.";
      }
    }
  );
}
async function exportBackup(){
  const photosSize = estimateAllPhotosSize();
  const LARGE_THRESHOLD = 300*1024*1024; // 183 Mo confirmé fonctionnel sur iPhone ; on prévient seulement au-delà d'un volume vraiment conséquent
  if(photosSize > LARGE_THRESHOLD){
    showChoice(
      `Ta sauvegarde contient énormément de photos (environ ${formatBytes(photosSize)}). Ça risque de faire échouer l'export faute de mémoire disponible sur cet appareil. Comment veux-tu procéder ?`,
      "Avec les photos quand même", "Sans les photos (recommandé)",
      ()=>doExportBackup(true),
      ()=>doExportBackup(false)
    );
    return;
  }
  doExportBackup(true);
}
async function doExportBackup(includePhotos){
  const msg = document.getElementById("backupMsg");
  try{
    const payload = {
      schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
      added: userAdded, deleted: [...deletedNums], bdTrash: bdTrash, parabd: parabdItems, parabdTrash: parabdTrash, wishlist: wishlist, baseFinances: baseFinances, sold: soldItems, forSale: forSaleItems, vitrine: VITRINE,
      photos: includePhotos ? PHOTOS : {}
    };
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,"0");
    const mm = String(now.getMonth()+1).padStart(2,"0");
    const yy = String(now.getFullYear()).slice(2);
    const jsonText = JSON.stringify(payload);
    // Compresser des photos JPEG (déjà compressées) apporte très peu et double temporairement la mémoire utilisée
    // (le texte source ET sa version compressée coexistent le temps de l'opération) : sur un gros export avec
    // photos, on saute cette étape pour limiter le pic mémoire, quitte à avoir un fichier un peu plus lourd.
    const skipCompression = includePhotos && jsonText.length > 30*1024*1024;
    const compressed = skipCompression ? null : await compressText(jsonText);
    const filename = compressed
      ? `sauvegarde_bd_v${APP_VERSION}_${dd}-${mm}-${yy}.json.gz`
      : `sauvegarde_bd_v${APP_VERSION}_${dd}-${mm}-${yy}.json`;
    const blob = compressed
      ? new Blob([compressed], { type:"application/gzip" })
      : new Blob([jsonText], { type:"application/json" });

    // Sur iPhone, on propose d'abord le partage natif (permet de choisir "Mail" avec le fichier
    // déjà joint) ; si ce n'est pas possible, on retombe sur le téléchargement classique.
    try{
      const file = new File([blob], filename, { type: blob.type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Sauvegarde Collection BD" });
        setLastExportAt();
        if(msg) msg.textContent = includePhotos ? "Sauvegarde exportée avec succès." : `Sauvegarde exportée avec succès, sans les photos. Utilise "Exporter uniquement les photos (.zip)" pour elles séparément.`;
        return;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === "AbortError"){
        // L'utilisateur a simplement annulé le partage : ce n'est pas un échec, rien à signaler.
        if(msg) msg.textContent = "";
        return;
      }
      throw shareErr; // une vraie erreur de partage est traitée comme un échec d'export ci-dessous
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setLastExportAt();
    if(msg) msg.textContent = includePhotos ? "Sauvegarde exportée avec succès." : `Sauvegarde exportée avec succès, sans les photos. Utilise "Exporter uniquement les photos (.zip)" pour elles séparément.`;
  }catch(err){
    const detail = err && err.message ? ` (${err.message})` : "";
    if(msg) msg.textContent = includePhotos
      ? `Échec de l'export${detail} — probablement un manque de mémoire à cause du volume de photos. Réessaie en choisissant de les exclure, puis utilise "Exporter uniquement les photos (.zip)" séparément. Si ça continue à échouer même sans les photos, ou si tu veux vraiment tout inclure dans un seul fichier malgré le volume, redemande à Claude de retravailler la méthode d'export.`
      : `Échec de l'export${detail}. Réessaie.`;
  }
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = async e=>{
    const msg = document.getElementById("backupMsg");
    try{
      const buf = e.target.result;
      const text = looksGzip(buf) ? await decompressToText(buf) : new TextDecoder("utf-8").decode(buf);
      const data = JSON.parse(text);

      if(data.visitorSession && data.visitorSession.expiresAt){
        // Fichier de partage visiteur : jamais fusionné avec les données réelles de cet appareil.
        // On écrit directement dans l'espace isolé "visitor__...", puis on recharge la page pour
        // repartir sur un état propre en mode visiteur (même chemin de démarrage que testé).
        const prefix = "visitor__";
        localStorage.setItem(prefix+LS_ADDED, JSON.stringify((Array.isArray(data.added) ? data.added : []).map(normalizeRow)));
        localStorage.setItem(prefix+LS_DELETED, JSON.stringify(Array.isArray(data.deleted) ? data.deleted : []));
        localStorage.setItem(prefix+LS_PARABD, JSON.stringify((Array.isArray(data.parabd) ? data.parabd : []).map(normalizeParaItem)));
        const visitorPhotos = data.photos || {};
        const openReq = indexedDB.open("bdcollection_db_visitor", 1);
        openReq.onupgradeneeded = ()=>{ openReq.result.createObjectStore("photos"); };
        const finishActivation = ()=>{
          localStorage.setItem(LS_VISITOR_SESSION, JSON.stringify({ expiresAt: data.visitorSession.expiresAt }));
          location.reload();
        };
        openReq.onsuccess = ()=>{
          try{
            const db = openReq.result;
            const tx = db.transaction("photos", "readwrite");
            const store = tx.objectStore("photos");
            Object.keys(visitorPhotos).forEach(key=>store.put(visitorPhotos[key], key));
            tx.oncomplete = finishActivation;
            tx.onerror = finishActivation;
          }catch(e){ finishActivation(); }
        };
        openReq.onerror = finishActivation;
        return;
      }

      // normalizeRow() absorbe aussi bien une sauvegarde faite avec une version plus ancienne (ou future) du code
      const incomingAdded = (Array.isArray(data.added) ? data.added : []).map(normalizeRow);
      const existingNums = new Set(userAdded.map(r=>r.num));
      incomingAdded.forEach(r=>{ if(!existingNums.has(r.num)){ userAdded.push(r); existingNums.add(r.num); } });
      saveAdded(userAdded);
      (Array.isArray(data.deleted) ? data.deleted : []).forEach(n=>deletedNums.add(n));
      saveDeleted();
      const incomingBdTrash = Array.isArray(data.bdTrash) ? data.bdTrash : [];
      const existingBdTrashNums = new Set(bdTrash.map(r=>r.num));
      incomingBdTrash.forEach(r=>{ if(!existingBdTrashNums.has(r.num)){ bdTrash.push(r); existingBdTrashNums.add(r.num); } });
      saveBdTrash();
      const incomingParabd = Array.isArray(data.parabd) ? data.parabd : [];
      const existingParaIds = new Set(parabdItems.map(p=>p.id));
      incomingParabd.forEach(p=>{ if(!existingParaIds.has(p.id)){ parabdItems.push(p); existingParaIds.add(p.id); } });
      saveParabd();
      const incomingParabdTrash = Array.isArray(data.parabdTrash) ? data.parabdTrash : [];
      const existingTrashIds = new Set(parabdTrash.map(p=>p.id));
      incomingParabdTrash.forEach(p=>{ if(!existingTrashIds.has(p.id)){ parabdTrash.push(p); existingTrashIds.add(p.id); } });
      saveParabdTrash();
      const incomingWishlist = (Array.isArray(data.wishlist) ? data.wishlist : []).map(normalizeWishItem);
      const existingWishIds = new Set(wishlist.map(w=>w.id));
      incomingWishlist.forEach(w=>{ if(!existingWishIds.has(w.id)){ wishlist.push(w); existingWishIds.add(w.id); } });
      saveWishlist();
      const incomingBaseFinances = (data.baseFinances && typeof data.baseFinances === "object") ? data.baseFinances : {};
      Object.keys(incomingBaseFinances).forEach(k=>{ baseFinances[k] = incomingBaseFinances[k]; });
      saveBaseFinances();
      const incomingSold = (Array.isArray(data.sold) ? data.sold : []).map(normalizeSoldItem);
      const existingSoldNums = new Set(soldItems.map(s=>s.num));
      incomingSold.forEach(s=>{ if(!existingSoldNums.has(s.num)){ soldItems.push(s); existingSoldNums.add(s.num); } });
      saveSold();
      const incomingForSale = (Array.isArray(data.forSale) ? data.forSale : []).map(normalizeForSaleItem);
      const existingForSaleNums = new Set(forSaleItems.map(f=>f.num));
      incomingForSale.forEach(f=>{ if(!existingForSaleNums.has(f.num)){ forSaleItems.push(f); existingForSaleNums.add(f.num); } });
      saveForSale();
      // La vitrine est une préférence (pas un historique) : on ne l'adopte que si celle de cet appareil est encore vide,
      // pour ne jamais écraser une sélection déjà faite ici en cas de fusion avec un autre appareil.
      if((!VITRINE || VITRINE.length===0) && Array.isArray(data.vitrine) && data.vitrine.length){
        VITRINE = data.vitrine.map(normalizeVitrineEntry);
        saveVitrine();
      }
      const incomingPhotos = data.photos || {};
      const changedKeys = [];
      Object.keys(incomingPhotos).forEach(key=>{
        if(!PHOTOS[key]) PHOTOS[key] = [];
        incomingPhotos[key].forEach(src=>{ if(!PHOTOS[key].includes(src)) PHOTOS[key].push(src); });
        changedKeys.push(key);
      });
      await Promise.all(changedKeys.map(k=>idbSavePhotosFor(k)));
      refreshDerived();
      if(msg) msg.textContent = "Sauvegarde importée avec succès.";
    }catch(err){
      if(msg){
        msg.textContent = (err && err.code === "DECOMPRESSION_UNSUPPORTED")
          ? "Ce fichier de sauvegarde est compressé (.gz) mais ce navigateur est trop ancien pour le décompresser. Réessaie avec une version récente de Safari/Chrome, ou réexporte une sauvegarde depuis l'appareil qui a servi à faire ce fichier."
          : "Ce fichier ne ressemble pas à une sauvegarde valide.";
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function handleAddSubmit(e){

  const serie = val("f_serie"), titre = val("f_titre");
  if(!serie || !titre){
    showAlert("Il faut au moins renseigner la série et le titre pour ajouter une BD.");
    return;
  }
  const existing = OWNED.find(a=>normalizeText(a.serie)===normalizeText(serie) && normalizeText(a.titre)===normalizeText(titre));
  if(existing){
    showChoice(
      `Tu as déjà « ${existing.titre} » dans ta collection. Ajouter cette BD comme nouvel exemplaire du même album ?`,
      "Oui, même album", "Non, BD différente",
      ()=>finalizeAddSubmit(serie, titre, existing),
      ()=>finalizeAddSubmit(serie, titre, null)
    );

function finalizeAddSubmit(serie, titre, mergeInto){
  const val = id => document.getElementById(id).value.trim();
  const cout = parseFloat(val("f_cout")); const vente = parseFloat(val("f_vente"));
  const row = {
    num: addDraftNum, // le même numéro que celui utilisé pour les photos ajoutées pendant la saisie
    displayNum: mergeInto ? null : nextDisplayNum(),
    // En cas de fusion confirmée, on reprend exactement série/titre/tome/format de l'album existant :
    // c'est ce qui garantit la fusion en exemplaire supplémentaire (la clé de regroupement doit être identique au caractère près).
    serie: mergeInto ? mergeInto.serie : serie,
    titre: mergeInto ? mergeInto.titre : titre,
    tome: mergeInto ? mergeInto.tome : (val("f_tome") || "Unique"),
    format: mergeInto ? mergeInto.format : (val("f_format") || "Classique"),
    eo: document.getElementById("f_eo").checked,
    annee: val("f_annee") || null,
    editeur: val("f_editeur") || null,
    etat: val("f_etat") || null,
    cout: isNaN(cout) ? null : cout,
    vente: isNaN(vente) ? null : vente,
    cote: val("f_cote") || "Non coté",
    commentaire: val("f_commentaire") || "",
    owned: true,
    addedAt: new Date().toISOString()
  };
  userAdded.push(row);
  saveAdded(userAdded);
  refreshDerived();
  const matchedWish = wishlist.find(w=>normalizeText(w.serie)===normalizeText(serie) && normalizeText(w.titre)===normalizeText(titre));
  if(matchedWish) removeFromWishlist(matchedWish.id);
  const nbPhotos = (PHOTOS["ex"+addDraftNum] || []).length;
  const base = mergeInto ? `« ${titre} » ajouté comme nouvel exemplaire de ta collection.` : `« ${titre} » ajouté à ta collection.`;
  const photoNote = nbPhotos ? ` (${nbPhotos} photo${nbPhotos>1?"s":""} incluse${nbPhotos>1?"s":""})` : "";
  document.getElementById("formMsg").textContent = (matchedWish ? `${base} (et retiré de ta liste de souhait)` : base) + photoNote;
  document.getElementById("addForm").reset();
  // prépare un nouveau brouillon (et sa vignette photo vide) pour un éventuel prochain ajout
  addDraftNum = nextUserNum();
  const strip = document.getElementById("addDraftPhotoStrip");
  if(strip) strip.innerHTML = renderAddDraftPhotoThumbs();
}

function photoProgress(){
  const allEx = OWNED.flatMap(a=>a.exemplaires.map(e=>({...e, serie:a.serie, titre:a.titre, tome:a.tome})));
  const missing = allEx.filter(e=>!(PHOTOS[e.key]||[]).length);
  return { total: allEx.length, withPhoto: allEx.length-missing.length, missing };
}
function photoProgressPara(){
  const missing = parabdItems.filter(p=>!(PHOTOS["para"+p.id]||[]).length);
  return { total: parabdItems.length, withPhoto: parabdItems.length-missing.length, missing };
}
// Ne regarde que le format "Classique" : les Intégrales/Fac-similés ont leur propre numérotation, pas censée être continue.
// Références connues (données confirmées par l'utilisateur) du nombre réel de tomes existants pour certaines séries —
// permet d'aller au-delà de la simple détection de trous entre ce qu'on possède déjà, pour ces séries précises.
const KNOWN_SERIES_TOMES = {
  "asterix": { display:"Astérix", min:1, max:41 },
  "barbe-rouge": { display:"Barbe-Rouge", min:1, max:35 },
  "buddy longway": { display:"Buddy Longway", min:1, max:20 },
  "largo winch": { display:"Largo Winch", min:1, max:25 },
  "tintin": { display:"Tintin", min:1, max:24 },
  "valerian": { display:"Valérian", min:0, max:21 }
};
function computeKnownSeriesCompletion(){
  return Object.keys(KNOWN_SERIES_TOMES).map(key=>{
    const known = KNOWN_SERIES_TOMES[key];
    const tomes = OWNED
      .filter(a=>normalizeText(a.serie)===key && formatBase(a.format)==="Classique")
      .map(a=>parseInt(a.tome,10)).filter(n=>!isNaN(n));
    const have = new Set(tomes);
    const total = known.max - known.min + 1;
    let owned = 0;
    for(let i=known.min;i<=known.max;i++) if(have.has(i)) owned++;
    return { serie: known.display, owned, total, pct: Math.round((owned/total)*100) };
  }).sort((a,b)=>b.pct-a.pct);
}
// Les 10 BD/objets Para-BD les plus récemment ajoutés, tous types confondus.
// Les BD/objets déjà présents avant l'introduction de cet horodatage n'ont pas de date connue et n'y figurent donc pas.
function getRecentlyAdded(){
  const bdItems = OWNED.flatMap(a=>a.exemplaires
    .map((ex,exIndex)=>({ ex, exIndex }))
    .filter(x=>x.ex.addedAt)
    .map(x=>({ type:"bd", addedAt:x.ex.addedAt, aid:a.aid, exIndex:x.exIndex, titre:a.titre, serie:a.serie }))
  );
  const paraItems = parabdItems.filter(p=>p.addedAt).map(p=>({
    type:"para", addedAt:p.addedAt, id:p.id, titre:p.objet || p.categorie, serie:p.serie
  }));
  return [...bdItems, ...paraItems].sort((a,b)=>b.addedAt.localeCompare(a.addedAt)).slice(0,10);
}
// Condense une liste de nombres triés en plages lisibles, ex. [2,3,4,7,9,10] -> "2-4, 7, 9-10"
function collapseRanges(numbers){
  if(!numbers.length) return "";
  const parts = [];
  let start = numbers[0], prev = numbers[0];
  for(let i=1;i<=numbers.length;i++){
    const n = numbers[i];
    if(n === prev+1){ prev = n; continue; }
    parts.push(start===prev ? `${start}` : `${start}-${prev}`);
    start = prev = n;
  }
  return parts.join(", ");
}
function detectMissingTomes(){
  const results = [];
  const seriesNames = [...new Set(OWNED.filter(a=>formatBase(a.format)==="Classique").map(a=>a.serie))];
  seriesNames.forEach(serie=>{
    const tomes = OWNED
      .filter(a=>a.serie===serie && formatBase(a.format)==="Classique")
      .map(a=>parseInt(a.tome,10)).filter(n=>!isNaN(n));
    const known = KNOWN_SERIES_TOMES[normalizeText(serie)];
    if(!known && tomes.length<2) return; // sans référence connue, il faut au moins 2 tomes pour parler d'un "trou"
    const min = known ? known.min : Math.min(...tomes);
    const max = known ? known.max : Math.max(...tomes);
    const have = new Set(tomes);
    const missing = [];
    for(let i=min;i<=max;i++) if(!have.has(i)) missing.push(i);
    if(missing.length) results.push({ serie, missing, min, max, exhaustive: !!known });
  });
  return results.sort((a,b)=>a.serie.localeCompare(b.serie,"fr"));
}

// Accordéon exclusif de l'onglet Profil : ouvrir une section referme les autres.
// On intercepte le clic sur <summary> plutôt que l'événement "toggle" (qui se déclenche de façon
// asynchrone dans les navigateurs récents, ce qui rendait un simple drapeau peu fiable).
let profileAllExpanded = false;
function bindProfileAccordion(){
  profileAllExpanded = false; // le HTML est toujours régénéré fermé à chaque rendu : on resynchronise le bouton
  const expandAllBtn = document.getElementById("expandAllProfil");
  if(expandAllBtn) expandAllBtn.textContent = "Tout déplier";
  const cards = document.querySelectorAll("#main .profile-card");
  cards.forEach(d=>{
    const summary = d.querySelector(":scope > summary");
    if(!summary) return;
    summary.addEventListener("click", e=>{
      e.preventDefault();
      if(d.open){
        d.open = false; // referme seulement celle-ci
      } else {
        cards.forEach(o=>{ o.open = false; }); // referme les autres avant d'ouvrir celle-ci
        d.open = true;
      }
      profileAllExpanded = false;
      if(expandAllBtn) expandAllBtn.textContent = "Tout déplier";
    });
  });
  if(expandAllBtn) expandAllBtn.addEventListener("click", ()=>{
    profileAllExpanded = !profileAllExpanded;
    cards.forEach(d=>{ d.open = profileAllExpanded; });
    expandAllBtn.textContent = profileAllExpanded ? "Tout replier" : "Tout déplier";
  });
}

  const missingHtml = missing.map(e=>`
