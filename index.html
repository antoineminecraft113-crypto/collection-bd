    <div class="rarity-row">
      <span style="flex:1;">${p.objet||p.categorie||"Non renseigné"} <span style="color:var(--ink-soft);">· ${p.serie}${p.categorie?" · "+p.categorie:""}</span></span>
    </div>
  `).join("");

  // Toutes les paires (exemplaire + contexte de son album), pour lister les BD derrière chaque statistique.
  const allExWithContext = OWNED.flatMap(a=>a.exemplaires.map(ex=>({ titre:a.titre, format:a.format, annee:ex.annee, etat:ex.etat, editeur:ex.editeur })));
  function albumMiniList(list){
    return list.slice().sort((a,b)=>a.titre.localeCompare(b.titre,"fr")).map(x=>`
      <div class="rarity-row"><span style="flex:1;">${x.titre} <span style="color:var(--ink-soft);">· ${x.format} · ${x.annee||"Non renseigné"}</span></span></div>
    `).join("");
  }
  function bucketDetails(list){
    if(!list.length) return "";
    return `<details class="mini-details"><summary>Voir les BD (${list.length})</summary><div class="mini-details-body">${albumMiniList(list)}</div></details>`;
  }

  const etatCounts = ETAT_OPTIONS.map(e=>({
    etat: e,
    count: OWNED.reduce((s,a)=>s+a.exemplaires.filter(ex=>ex.etat===e).length, 0)
  }));
  const etatTotal = OWNED.reduce((s,a)=>s+a.exemplaires.length, 0);
  const etatMax = Math.max(...etatCounts.map(e=>e.count), 1);
  const etatBars = etatCounts.map(e=>`
    <div class="bar-row">
      <div class="bar-label"><span>${e.etat}</span><span class="mono">${e.count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(e.count/etatMax*100).toFixed(0)}%; background:${etatColor(e.etat)};"></div></div>
    </div>
    ${bucketDetails(allExWithContext.filter(x=>x.etat===e.etat))}
  `).join("");

  const serieValues = SERIE_COUNTS.map(s=>({
    serie: s.serie,
    value: OWNED.filter(a=>a.serie===s.serie).reduce((sum,a)=>sum+albumTotalVente(a),0)
  })).sort((a,b)=>b.value-a.value);
  const serieValueMax = Math.max(...serieValues.map(s=>s.value), 1);
  const serieValueBars = serieValues.slice(0,12).map(s=>`
    <div class="bar-row">
      <div class="bar-label"><span>${s.serie}</span><span class="mono">${eur(s.value)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(s.value/serieValueMax*100).toFixed(0)}%; background:var(--gold);"></div></div>
    </div>
  `).join("");

  // --- Nouvelles statistiques ---
  const editeurCounts = {};
  OWNED.forEach(a=>a.exemplaires.forEach(ex=>{
    const ed = ex.editeur || "Non renseigné";
    editeurCounts[ed] = (editeurCounts[ed]||0)+1;
  }));
  const editeurList = Object.entries(editeurCounts).map(([editeur,count])=>({editeur,count})).sort((a,b)=>b.count-a.count);
  const editeurMax = Math.max(...editeurList.map(e=>e.count), 1);
  const editeurBars = editeurList.slice(0,12).map(e=>`
    <div class="bar-row">
      <div class="bar-label"><span>${e.editeur}</span><span class="mono">${e.count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(e.count/editeurMax*100).toFixed(0)}%"></div></div>
    </div>
    ${bucketDetails(allExWithContext.filter(x=>(x.editeur||"Non renseigné")===e.editeur))}
  `).join("");

  const decadeCounts = {};
  OWNED.forEach(a=>a.exemplaires.forEach(ex=>{
    const y = parseInt((ex.annee||"").toString(),10);
    const label = isNaN(y) ? "Non renseigné" : (Math.floor(y/10)*10)+"s";
    decadeCounts[label] = (decadeCounts[label]||0)+1;
  }));
  const decadeList = Object.entries(decadeCounts).map(([decade,count])=>({decade,count})).sort((a,b)=>{
    if(a.decade==="Non renseigné") return 1;
    if(b.decade==="Non renseigné") return -1;
    return parseInt(a.decade,10) - parseInt(b.decade,10);
  });
  const decadeMax = Math.max(...decadeList.map(d=>d.count), 1);
  function decadeLabelOf(annee){
    const y = parseInt((annee||"").toString(),10);
    return isNaN(y) ? "Non renseigné" : (Math.floor(y/10)*10)+"s";
  }
  const decadeBars = decadeList.map(d=>`
    <div class="bar-row">
      <div class="bar-label"><span>${d.decade}</span><span class="mono">${d.count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.count/decadeMax*100).toFixed(0)}%"></div></div>
    </div>
    ${bucketDetails(allExWithContext.filter(x=>decadeLabelOf(x.annee)===d.decade))}
  `).join("");

  const valeurMoyenne = etatTotal ? totalVente/etatTotal : 0;
  const eoCount = OWNED.reduce((s,a)=>s+a.exemplaires.filter(ex=>ex.eo).length, 0);
  const eoPct = etatTotal ? Math.round(eoCount/etatTotal*100) : 0;

  const paraCatCounts = {};
  parabdItems.forEach(p=>{
    const c = p.categorie || "Non renseigné";
    paraCatCounts[c] = (paraCatCounts[c]||0)+1;
  });
  const paraCatList = Object.entries(paraCatCounts).map(([categorie,count])=>({categorie,count})).sort((a,b)=>b.count-a.count);
  const paraCatMax = Math.max(...paraCatList.map(c=>c.count), 1);
  const paraCatBars = paraCatList.map(c=>`
    <div class="bar-row">
      <div class="bar-label"><span>${c.categorie}</span><span class="mono">${c.count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.count/paraCatMax*100).toFixed(0)}%"></div></div>
    </div>
  `).join("");

  const missingTomes = detectMissingTomes();
  const seriesCompletion = computeKnownSeriesCompletion();
  const recentlyAdded = getRecentlyAdded();

  // --- BD vendues ---
  const soldTotalCout = soldItems.reduce((s,x)=>s+(x.cout||0),0);
  const soldTotalVente = soldItems.reduce((s,x)=>s+(x.prixVente||0),0);
  const soldDelta = soldTotalVente - soldTotalCout;
  const soldDeltaLabel = (soldDelta>=0?"+":"−")+eur(Math.abs(soldDelta));

  const forSaleRows = forSaleItems.slice()
    .sort((a,b)=>(b.dateMiseEnVente||"").localeCompare(a.dateMiseEnVente||""))
    .map(f=>{
      const album = ALBUMS.find(a=>a.exemplaires.some(e=>e.num===f.num));
      const titre = album ? album.titre : "BD introuvable";
      return `
        <div class="wish-row" data-forsaledetail="${f.num}" style="cursor:pointer;">
          <div class="wish-main">
            <div class="wish-title">${titre}</div>
            <div class="wish-sub">${eur(f.prixVente)}${f.dateMiseEnVente ? " · "+formatDateFR(f.dateMiseEnVente) : ""}${f.lieuVente ? " · "+f.lieuVente : ""}</div>
          </div>
        </div>
      `;
    }).join("") || `<div class="empty">Aucune BD en vente pour l'instant.</div>`;

  const soldRows = soldItems.slice()
    .sort((a,b)=>(b.dateVente||b.soldAt||"").localeCompare(a.dateVente||a.soldAt||""))
    .map(s=>{
      const delta = (s.cout!=null && s.prixVente!=null) ? (s.prixVente - s.cout) : null;
      const deltaLabel = delta==null ? "Non renseigné" : (delta>=0?"+":"−")+eur(Math.abs(delta));
      return `
        <div class="wish-row" data-solddetail="${s.num}" style="cursor:pointer;">
          <div class="wish-main">
            <div class="wish-title">${s.titre}</div>
            <div class="wish-sub">${eur(s.prixVente)}${s.dateVente ? " · "+formatDateFR(s.dateVente) : ""}${s.lieuVente ? " · "+s.lieuVente : ""}</div>
          </div>
          <div class="mono" style="font-size:12.5px; font-weight:700; color:var(--ink); flex:0 0 auto;">${deltaLabel}</div>
        </div>
      `;
    }).join("") || `<div class="empty">Aucune BD vendue pour l'instant.</div>`;

  const lieuCounts = {};
  soldItems.forEach(s=>{
    const l = s.lieuVente || "Non renseigné";
    if(!lieuCounts[l]) lieuCounts[l] = { count:0, total:0 };
    lieuCounts[l].count++;
    lieuCounts[l].total += (s.prixVente||0);
  });
  const lieuList = Object.entries(lieuCounts).map(([lieu,v])=>({lieu, ...v})).sort((a,b)=>b.total-a.total);
  const lieuMax = Math.max(...lieuList.map(l=>l.total), 1);
  const lieuBars = lieuList.map(l=>{
    const items = soldItems.filter(s=>(s.lieuVente||"Non renseigné")===l.lieu);
    const list = items.map(s=>`<div class="rarity-row"><span style="flex:1;">${s.titre} <span style="color:var(--ink-soft);">· ${eur(s.prixVente)}${s.dateVente?" · "+formatDateFR(s.dateVente):""}</span></span></div>`).join("");
    return `
      <div class="bar-row">
        <div class="bar-label"><span>${l.lieu}</span><span class="mono">${l.count} · ${eur(l.total)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(l.total/lieuMax*100).toFixed(0)}%; background:var(--gold);"></div></div>
      </div>
      <details class="mini-details"><summary>Voir les BD (${items.length})</summary><div class="mini-details-body">${list}</div></details>
    `;
  }).join("");

  const trashCount = trashedRows().length + parabdTrash.length;
  const corbeilleInner = renderCorbeilleSection();

  return `
    <div class="mini-stats">
      <div class="card mini-stat visitor-hide"><div class="val mono">${eur(totalCout)}</div><div class="lab">Coût total</div></div>
      <div class="card mini-stat visitor-hide"><div class="val mono">${eur(totalVente)}</div><div class="lab">Vente estim.</div></div>
      <div class="card mini-stat"><div class="val mono">${eur(totalCote)}</div><div class="lab">BDM / BD Gest</div></div>
    </div>
    <div style="text-align:right; margin-bottom:8px;">
      <button class="link-btn" id="expandAllProfil">Tout déplier</button>
    </div>

    <details class="card profile-card">
      <summary>Progression photo<span class="acc-sub">${photoPct}%</span></summary>
      <div class="acc-body">
        <div class="bar-row">
          <div class="bar-label"><span>${withPhoto} / ${photoTotal} BD photographiées</span><span class="mono">${photoPct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${photoPct}%"></div></div>
        </div>
        ${paraPhoto.total ? `
          <div class="bar-row" style="margin-top:6px;">
            <div class="bar-label"><span>${paraPhoto.withPhoto} / ${paraPhoto.total} objets Para-BD photographiés</span><span class="mono">${paraPhotoPct}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${paraPhotoPct}%"></div></div>
          </div>
        ` : ""}
        ${missing.length ? `
          <details class="mini-details"><summary>BD sans photo (${missing.length})</summary><div class="mini-details-body">${missingHtml}</div></details>
        ` : ""}
        ${paraPhoto.missing.length ? `
          <details class="mini-details"><summary>Para-BD sans photo (${paraPhoto.missing.length})</summary><div class="mini-details-body">${paraMissingHtml}</div></details>
        ` : ""}
      </div>
    </details>

    ${recentlyAdded.length ? `
      <details class="card profile-card">
        <summary>Derniers ajouts<span class="acc-sub">${recentlyAdded.length}</span></summary>
        <div class="acc-body">
          ${recentlyAdded.map(r=>`
            <div class="wish-row" data-recentitem="${r.type}:${r.type==='bd' ? r.aid+':'+r.exIndex : r.id}" style="cursor:pointer;">
              <div class="wish-main">
                <div class="wish-title">${r.titre}${r.type==='para' ? ' <span style="color:var(--ink-soft); font-weight:400;">(Para-BD)</span>' : ''}</div>
                <div class="wish-sub">${r.serie} · ajouté le ${formatDateTime(r.addedAt)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      </details>
    ` : ""}

    <details class="card profile-card visitor-hide">
      <summary>Liste de souhait<span class="acc-sub">${wishlist.length}</span></summary>
      <div class="acc-body">${renderWishlistSection()}</div>
    </details>

    <details class="card profile-card">
      <summary>Statistiques</summary>
      <div class="acc-body">
        <p class="section-title" style="margin-top:0;">Répartition par état (${etatTotal})</p>
        ${etatBars}

        <p class="section-title">Chiffres clés</p>
        <div class="mini-stats-2">
          <div class="card mini-stat visitor-hide" style="background:var(--well);"><div class="val mono">${eur(valeurMoyenne)}</div><div class="lab">Valeur moy. / exemplaire</div></div>
          <div class="card mini-stat" style="background:var(--well);"><div class="val mono">${eoCount} (${eoPct}%)</div><div class="lab">Éditions originales</div></div>
        </div>

        <p class="section-title">Répartition par série (${SERIES.length})</p>
        ${bars}

        <p class="section-title visitor-hide">Valeur par série (vente)</p>
        <div class="visitor-hide">${serieValueBars}</div>

        <p class="section-title">Répartition par éditeur</p>
        ${editeurBars}

        <p class="section-title">Répartition par décennie de parution</p>
        ${decadeBars}

        <p class="section-title">Espace de stockage (photos)</p>
        <div id="storageGauge" style="font-size:12.5px; color:var(--ink-soft);">Calcul en cours…</div>
      </div>
    </details>

    ${parabdItems.length ? `
      <details class="card profile-card">
        <summary>Para-BD par catégorie<span class="acc-sub">${parabdItems.length}</span></summary>
        <div class="acc-body">${paraCatBars}</div>
      </details>
    ` : ""}

    ${(soldItems.length || forSaleItems.length) ? `
      <details class="card profile-card visitor-hide">
        <summary>BD en vente ou vendues<span class="acc-sub">${soldItems.length + forSaleItems.length}</span></summary>
        <div class="acc-body">
          ${forSaleItems.length ? `
            <p class="section-title" style="margin-top:0;">En vente (${forSaleItems.length})</p>
            <div id="forSaleResults">${forSaleRows}</div>
          ` : ""}
          ${soldItems.length ? `
            <p class="section-title">Vendues (${soldItems.length})</p>
            <div class="mini-stats-2" style="margin-bottom:16px;">
              <div class="card mini-stat" style="background:var(--well);"><div class="val mono">${eur(soldTotalCout)} → ${eur(soldTotalVente)}</div><div class="lab">Coût → Vente cumulés</div></div>
              <div class="card mini-stat" style="background:var(--well);"><div class="val mono">${soldDeltaLabel}</div><div class="lab">Plus/moins-value totale</div></div>
            </div>
            <div id="soldResults">${soldRows}</div>
            ${lieuList.length ? `
              <p class="section-title">Répartition par lieu de vente</p>
              ${lieuBars}
            ` : ""}
            <button type="button" class="btn-secondary visitor-hide" id="exportSoldHistoryBtn" style="width:100%; margin-top:12px;">Exporter l'historique des ventes</button>
          ` : ""}
        </div>
      </details>
    ` : ""}

    ${(missingTomes.length || seriesCompletion.length) ? `
      <details class="card profile-card">
        <summary>Tomes manquants détectés<span class="acc-sub">${missingTomes.length} série${missingTomes.length>1?"s":""}</span></summary>
        <div class="acc-body">
          <p class="section-title" style="margin-top:0;">Complétion des séries connues</p>
          ${seriesCompletion.map(s=>`
            <div class="bar-row">
              <div class="bar-label"><span>${s.serie}</span><span class="mono">${s.owned}/${s.total} (${s.pct}%)</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div>
            </div>
          `).join("")}
          ${missingTomes.length ? `<p class="section-title">Détail des tomes manquants</p>` : ""}
          ${missingTomes.map(m=>`
            <div class="bar-row" style="margin-bottom:14px;">
              <div style="font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:3px;">${m.serie}</div>
              <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">
                Tome${m.missing.length>1?"s":""} ${collapseRanges(m.missing)}
                ${m.exhaustive ? ` — sur ${m.max-m.min+1} au total` : ` — entre les tomes ${m.min} et ${m.max} possédés`}
              </div>
            </div>
          `).join("")}
        </div>
      </details>
    ` : ""}

    ${corbeilleInner ? `
      <details class="card profile-card">
        <summary>Corbeille<span class="acc-sub">${trashCount}</span></summary>
        <div class="acc-body">${corbeilleInner}</div>
      </details>
    ` : ""}

    <div style="text-align:center; margin-top:20px;">
      <button class="link-btn" id="openGuideBtn">Guide de l'application</button>
    </div>
  `;
}

let trashQuery = "";
function renderCorbeilleSection(){
  const totalTrashed = trashedRows().length + parabdTrash.length;
  if(!totalTrashed && !trashQuery) return "";
  return `
    <input class="search-input" id="trashSearch" placeholder="Chercher dans la corbeille…" value="${trashQuery}" style="margin-bottom:12px;">
    <div id="trashResults">${renderCorbeilleRows()}</div>
  `;
}
function renderCorbeilleRows(){
  const q = normalizeText(trashQuery);
  const bdRows = trashedRows()
    .filter(r=>!q || normalizeText(r.titre).includes(q) || normalizeText(r.serie).includes(q))
    .sort((a,b)=>(b.deletedAt||"").localeCompare(a.deletedAt||""));
  const paraRows = parabdTrash
    .filter(p=>!q || normalizeText(p.objet||"").includes(q) || normalizeText(p.categorie||"").includes(q) || normalizeText(p.serie).includes(q))
    .sort((a,b)=>(b.deletedAt||"").localeCompare(a.deletedAt||""));

  const bdHtml = bdRows.map(r=>`
    <div class="rarity-row">
      <span class="badge neutral" style="margin-right:8px;">BD</span>
      <div style="flex:1; padding-right:8px;">
        <div>${r.titre}${r.serie?" · "+r.serie:""}</div>
        <div style="font-size:11px; color:var(--ink-soft);">Supprimé le ${formatDateTime(r.deletedAt)}</div>
      </div>
      <div class="trash-actions">
        <button class="link-btn" data-restore="${r.num}">Restaurer</button>
        <button class="link-btn trash-purge" data-purge="${r.num}">Vider</button>
      </div>
    </div>
  `).join("");
  const paraHtml = paraRows.map(p=>`
    <div class="rarity-row">
      <span class="badge" style="background:var(--accent); margin-right:8px;">Para-BD</span>
      <div style="flex:1; padding-right:8px;">
        <div>${(p.objet||p.categorie)}${p.serie?" · "+p.serie:""}</div>
        <div style="font-size:11px; color:var(--ink-soft);">Supprimé le ${formatDateTime(p.deletedAt)}</div>
      </div>
      <div class="trash-actions">
        <button class="link-btn" data-restorepara="${p.id}">Restaurer</button>
        <button class="link-btn trash-purge" data-purgepara="${p.id}">Vider</button>
      </div>
    </div>
  `).join("");

  return (bdHtml+paraHtml) || `<div class="empty">Aucun résultat.</div>`;
}

/* ================================================================
   RENDU : LISTE DE SOUHAIT
   ================================================================ */
let wishQuery = "";
function renderWishlistRows(){
  const q = normalizeText(wishQuery);
  const rows = wishlist
    .filter(w=>!q || normalizeText(w.titre).includes(q) || normalizeText(w.serie).includes(q))
    .sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||""))
    .map(w=>`
      <div class="wish-row" data-wishdetail="${w.id}" style="cursor:pointer;">
        <div class="wish-main">
          <div class="wish-title">${w.titre}</div>
          <div class="wish-sub">${w.serie}${w.commentaire ? " · "+w.commentaire : ""}</div>
        </div>
        <button class="link-btn" data-wishremove="${w.id}">Retirer</button>
      </div>
    `).join("");
  return rows || `<div class="empty">${wishlist.length ? "Aucun résultat." : "Ta liste de souhait est vide pour l'instant."}</div>`;
}
function renderWishlistSection(){
  return `
    <input class="search-input" id="wishSearch" placeholder="Chercher dans ta liste…" value="${wishQuery}" style="margin-bottom:10px;">
    <div id="wishResults">${renderWishlistRows()}</div>
  `;
}
function bindWishlistSearch(){
  document.querySelectorAll("[data-wishremove]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation(); // ne doit pas aussi déclencher l'ouverture de la fiche (data-wishdetail sur la ligne parente)
      const id = Number(el.dataset.wishremove);
      showConfirm("Retirer cet article de ta liste de souhait ?", "Retirer", ()=>{
        removeFromWishlist(id);
        render();
      });
    });
  });
  document.querySelectorAll("[data-wishdetail]").forEach(el=>{
    el.addEventListener("click", ()=>openWishDetail(Number(el.dataset.wishdetail)));
  });
  const wishSearch = document.getElementById("wishSearch");
  if(wishSearch){
    wishSearch.addEventListener("input", e=>{
      wishQuery = e.target.value;
      const caret = wishSearch.selectionStart;
      document.getElementById("wishResults").innerHTML = renderWishlistRows();
      bindWishlistSearch();
      const nb = document.getElementById("wishSearch");
      if(nb){ nb.focus(); nb.setSelectionRange(caret, caret); }
    });
  }
}
function renderWishDetail(id){
  const w = wishlist.find(x=>x.id===id);
  if(!w) return "";
  return `
    <button class="close-x" id="closeSheet">&times;</button>
    <div class="sheet-handle"></div>
    <div class="sheet-eyebrow">${w.serie || "Non renseigné"} · Liste de souhait</div>
    <div class="sheet-title">${w.titre}</div>
    <div class="sheet-meta">Non renseigné · Non renseigné · Non renseigné</div>
    <span class="badge" style="background:var(--well); color:var(--ink-soft);">Pas encore dans ta collection</span>
    <div class="ledger" style="margin-top:14px;">
      <div><div class="v mono">Non renseigné</div><div class="l">Coût</div></div>
      <div><div class="v mono">Non renseigné</div><div class="l">Vente</div></div>
      <div><div class="v mono">Non renseigné</div><div class="l">BDM/BD Gest</div></div>
    </div>
    <p class="sheet-note">${w.commentaire || "Aucune note."}</p>
    ${w.addedAt ? `<p class="photo-hint">Ajoutée à la liste de souhait le ${formatDateTime(w.addedAt)}.</p>` : ""}
    <div class="sheet-actions visitor-hide">
      <button class="btn-delete" id="wishDetailRemove" style="width:100%;">Retirer de la liste de souhait</button>
    </div>
  `;

function renderSoldDetail(num){

  if(!s) return "";
  const delta = (s.cout!=null && s.prixVente!=null) ? (s.prixVente - s.cout) : null;
  const deltaLabel = delta==null ? "Non renseigné" : (delta>=0?"+":"−")+eur(Math.abs(delta));
  const photos = PHOTOS["ex"+num] || [];
  const photoThumbs = photos.map(src=>`<div class="photo-thumb"><img src="${src}"></div>`).join("");
  return `

    <div class="ledger" style="margin-top:14px;">

    </div>
    <p style="font-size:12.5px; color:var(--ink-soft); margin:14px 2px 0;">
      Vendue ${s.dateVente ? "le "+formatDateFR(s.dateVente) : "à une date non renseignée"}${s.lieuVente ? " sur/via "+s.lieuVente : ""}.
    </p>
    <p class="sheet-note">${s.commentaire || "Aucun commentaire."}</p>

// Niveau catégorie : respecte l'arborescence (une collection = un titre, puis ses années en dessous), avant de passer à la suivante.
function renderParaCategoryPhotoView(){
  const allItems = paraItemsForCategorie(parabdState.serie, parabdState.categorie);
  const collected = allItems.filter(p=>p.collection);
  const uncollected = allItems.filter(p=>!p.collection);
  const collectionNames = distinctValues(collected.map(p=>p.collection));
  let html = "";
  collectionNames.forEach(colName=>{
    html += `<p class="section-title" style="margin-top:18px;">Collection ${colName}</p>`;
    html += renderParaYearGroups(collected.filter(p=>p.collection===colName));
  });
  if(uncollected.length){
    if(collectionNames.length) html += `<p class="section-title" style="margin-top:18px;">Sans collection</p>`;
    html += renderParaYearGroups(uncollected);
  }
  return html || `<div class="empty">Aucun objet à afficher.</div>`;
}

function renderParaCollectionPhotoView(){

function renderParaItemsList(){
  const allItems = paraItemsForCategorie(parabdState.serie, parabdState.categorie);
  const collected = allItems.filter(p=>p.collection);
  const uncollected = allItems.filter(p=>!p.collection);

  const collectionNames = distinctValues(collected.map(p=>p.collection));
  const collectionRows = collectionNames.map(colName=>{
    const itemsInCol = collected.filter(p=>p.collection===colName);

      <div class="card album-row" data-paracollection="${colName}">
        <div class="album-main">

  }).join("");

  let items = uncollected.slice();
  if(parabdState.sort==="add") items.sort((a,b)=>b.id-a.id);
  if(parabdState.sort==="annee") items.sort((a,b)=>(b.annee||"").localeCompare(a.annee||""));
  if(parabdState.sort==="etat") items.sort((a,b)=>(a.etat||"").localeCompare(b.etat||"","fr"));

  const sortOptions = {add:"Ordre d'ajout", annee:"Année", etat:"État"};
  const sortOpts = Object.keys(sortOptions).map(k=>`<option value="${k}" ${parabdState.sort===k?"selected":""}>${sortOptions[k]}</option>`).join("");

  const itemRows = items.map(renderParaItemRow).join("");

  const photoToggle = `

      <p class="section-title" style="margin:0;">${parabdState.categorie}</p>
      ${parabdState.photoView ? "" : `<select class="sort-select" id="paraSortSelect">${sortOpts}</select>`}
    </div>

    ${parabdState.photoView ? renderParaCategoryPhotoView() : rows}
  `;

function renderParaCollectionItemsList(){
  const allInCollection = parabdItems.filter(p=>p.serie===parabdState.serie && p.categorie===parabdState.categorie && p.collection===parabdState.collection);
  const annees = distinctValues(allInCollection.map(p=>p.annee || "Non renseigné"));

  const photoToggle = `
    <label class="switch-label">
      <input type="checkbox" id="paraPhotoToggle" ${parabdState.photoView?"checked":""}>
      <span class="switch-track"><span class="switch-thumb"></span></span>
      Afficher les objets par les photos
    </label>
  `;

  if(parabdState.photoView){
    return `
      <button class="back-btn" id="paraBackToItems">‹ ${parabdState.categorie}</button>
      <p class="section-title" style="margin:14px 2px 12px;">Collection ${parabdState.collection}</p>
      ${photoToggle}
      ${renderParaCollectionPhotoView()}
    `;
  }

  // Plusieurs millésimes différents dans cette collection et aucune année encore choisie : on montre d'abord les sous-groupes par année.
  if(!parabdState.annee && annees.length > 1){
    const anneeRows = annees.slice().sort((a,b)=>b.localeCompare(a)).map(an=>{
      const n = allInCollection.filter(p=>(p.annee||"Non renseigné")===an).length;
      return `

          <div class="album-main">
            <div class="album-title">Année ${an}</div>
            <div class="album-sub">${n} objet${n>1?"s":""}</div>
          </div>
          <div class="chev">›</div>
        </div>
      `;
    }).join("");
    return `
      <button class="back-btn" id="paraBackToItems">‹ ${parabdState.categorie}</button>
      <p class="section-title" style="margin:14px 2px 12px;">Collection ${parabdState.collection}</p>
      ${photoToggle}
      ${anneeRows || `<div class="empty">Aucun objet.</div>`}
    `;
  }

  let items = allInCollection.filter(p=> !parabdState.annee || (p.annee||"Non renseigné")===parabdState.annee).slice();
  if(parabdState.sort==="add") items.sort((a,b)=>b.id-a.id);
  if(parabdState.sort==="annee") items.sort((a,b)=>(b.annee||"").localeCompare(a.annee||""));
  if(parabdState.sort==="etat") items.sort((a,b)=>(a.etat||"").localeCompare(b.etat||"","fr"));

  const sortOptions = {add:"Ordre d'ajout", annee:"Année", etat:"État"};
  const sortOpts = Object.keys(sortOptions).map(k=>`<option value="${k}" ${parabdState.sort===k?"selected":""}>${sortOptions[k]}</option>`).join("");

  const rows = items.map(renderParaItemRow).join("") || `<div class="empty">Aucun objet.</div>`;

  // Si on est arrivé ici en ayant choisi une année (parmi plusieurs), le retour va vers la liste des années plutôt que vers la catégorie.
  const backId = (parabdState.annee && annees.length > 1) ? "paraBackToAnnees" : "paraBackToItems";
  const backLabel = (parabdState.annee && annees.length > 1) ? "Collection "+parabdState.collection : parabdState.categorie;
  const title = (parabdState.annee && annees.length > 1) ? `Collection ${parabdState.collection} · Année ${parabdState.annee}` : `Collection ${parabdState.collection}`;

  return `
    <button class="back-btn" id="${backId}">‹ ${backLabel}</button>
    <div class="row-between" style="margin:14px 2px 12px;">
      <p class="section-title" style="margin:0;">${title}</p>
      <select class="sort-select" id="paraSortSelect">${sortOpts}</select>
    </div>
    ${photoToggle}
    ${rows}
  `;
}

function bindParaDraftPhotoDelete(){
  document.querySelectorAll("[data-delparadraftphoto]").forEach(el=>{

      PHOTOS[key].splice(Number(el.dataset.delparadraftphoto), 1);
      await idbSavePhotosFor(key);

      bindParaDraftPhotoDelete();

}
function bindParaAddEvents(){
  attachCombo("pf_serie", "combo_pf_serie", ()=>distinctValues([...distinctParaSeries(), ...SERIES]));
  attachCombo("pf_categorie", "combo_pf_categorie", ()=>{
    const serie = document.getElementById("pf_serie").value;
    return distinctValues(paraItemsFor(serie).map(p=>p.categorie));
  });
  attachCombo("pf_editeur", "combo_pf_editeur", distinctParaEditeurs);
  attachCombo("pf_collection", "combo_pf_collection", ()=>{
    const serie = document.getElementById("pf_serie").value;
    const categorie = document.getElementById("pf_categorie").value;
    return distinctValues(parabdItems.filter(p=>p.serie===serie && p.categorie===categorie).map(p=>p.collection));
  });
  const draftPhotoInput = document.getElementById("paraDraftPhotoInput");
  if(draftPhotoInput){
    draftPhotoInput.addEventListener("change", async e=>{
      const key = "para"+paraDraftId;
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      const compressed = await Promise.all(files.map(f=>compressImage(f).catch(()=>null)));
      if(!PHOTOS[key]) PHOTOS[key] = [];
      compressed.filter(Boolean).forEach(src=>PHOTOS[key].push(src));
      await idbSavePhotosFor(key);
      document.getElementById("paraDraftPhotoStrip").innerHTML = renderParaDraftPhotoThumbs();
      bindParaDraftPhotoDelete();
    });
  }
  bindParaDraftPhotoDelete();
  const form = document.getElementById("paraAddForm");
  if(form) form.addEventListener("submit", e=>{
    e.preventDefault();
    const val = id => document.getElementById(id).value.trim();
    const serie = val("pf_serie"), categorieTyped = val("pf_categorie");
    if(!serie || !categorieTyped){
      showAlert("Il faut au moins renseigner la série et la catégorie pour ajouter un objet.");
      return;
    }
    const finalizeAdd = (categorie, collection) => {
      const cout = parseFloat(val("pf_cout"));
      const id = paraDraftId;
      parabdItems.push({
        id, serie, categorie, collection,
        objet: val("pf_objet") || null,
        annee: val("pf_annee") || null,
        etat: val("pf_etat") || null,
        editeur: val("pf_editeur") || null,
        cout: isNaN(cout) ? null : cout,
        commentaire: val("pf_commentaire") || "",
        addedAt: new Date().toISOString()
      });
      saveParabd();
      parabdState = { level:"items", serie, categorie, collection:null, annee:null, sort:"add", photoView:false };
      closeDetail();
      render();
      openParaDetail(id);
    };
    const resolveCollectionAndFinalize = categorie => {
      const collectionTyped = val("pf_collection");
      if(!collectionTyped){ finalizeAdd(categorie, null); return; }
      const foundCol = findSimilarCollection(serie, categorie, collectionTyped);
      if(foundCol && foundCol.exact){
        finalizeAdd(categorie, foundCol.match);
      } else if(foundCol && !foundCol.exact){
        showChoice(
          `Une collection proche, « ${foundCol.match} », existe déjà pour ${serie} / ${categorie}. Veux-tu y placer cet objet ?`,
          "Oui", "Non, nouvelle collection",
          ()=>finalizeAdd(categorie, foundCol.match),
          ()=>finalizeAdd(categorie, collectionTyped)
        );
      } else {
        finalizeAdd(categorie, collectionTyped);
      }
    };
    const found = findSimilarCategory(serie, categorieTyped);
    if(found && found.exact){
      resolveCollectionAndFinalize(found.match); // accents/majuscules seulement : rattachement silencieux
    } else if(found && !found.exact){
      showChoice(
        `Une catégorie proche, « ${found.match} », existe déjà pour ${serie}. Veux-tu y placer cet objet ?`,
        "Oui", "Non, nouvelle catégorie",
        ()=>resolveCollectionAndFinalize(found.match),
        ()=>resolveCollectionAndFinalize(categorieTyped)
      );
    } else {
      resolveCollectionAndFinalize(categorieTyped);
    }
  });
}

function bindParaEditFormEvents(){
  attachCombo("pef_serie", "combo_pef_serie", ()=>distinctValues([...distinctParaSeries(), ...SERIES]));
  attachCombo("pef_categorie", "combo_pef_categorie", ()=>{
    const serie = document.getElementById("pef_serie").value;
    return distinctValues(paraItemsFor(serie).map(x=>x.categorie));
  });
  attachCombo("pef_editeur", "combo_pef_editeur", distinctParaEditeurs);
  attachCombo("pef_collection", "combo_pef_collection", ()=>{
    const serie = document.getElementById("pef_serie").value;
    const categorie = document.getElementById("pef_categorie").value;
    return distinctValues(parabdItems.filter(p=>p.serie===serie && p.categorie===categorie).map(p=>p.collection));
  });
  const form = document.getElementById("paraEditForm");
  if(form) form.addEventListener("submit", e=>{
    e.preventDefault();
    const val = id => document.getElementById(id).value.trim();
    const serie = val("pef_serie"), categorieTyped = val("pef_categorie");
    if(!serie || !categorieTyped){
      showAlert("Il faut au moins renseigner la série et la catégorie.");
      return;
    }
    const finalizeEdit = (categorie, collection) => {
      const cout = parseFloat(val("pef_cout"));
      const fields = {
        serie, categorie, collection,
        objet: val("pef_objet") || null,

      if(foundCol && foundCol.exact){
        finalizeEdit(categorie, foundCol.match);
      } else if(foundCol && !foundCol.exact){
        showChoice(
          `Une collection proche, « ${foundCol.match} », existe déjà pour ${serie} / ${categorie}. Veux-tu y placer cet objet ?`,
          "Oui", "Non, nouvelle collection",

          ()=>finalizeEdit(categorie, collectionTyped)
        );
      } else {
        finalizeEdit(categorie, collectionTyped);
      }
    };
    const found = findSimilarCategory(serie, categorieTyped);
    if(found && found.exact){
      resolveCollectionAndFinalize(found.match);
    } else if(found && !found.exact){
      showChoice(
        `Une catégorie proche, « ${found.match} », existe déjà pour ${serie}. Veux-tu y placer cet objet ?`,
        "Oui", "Non, nouvelle catégorie",
        ()=>resolveCollectionAndFinalize(found.match),
        ()=>resolveCollectionAndFinalize(categorieTyped)
      );
    } else {
      resolveCollectionAndFinalize(categorieTyped);
    }
  });
}

  const a = ALBUMS.find(x=>x.exemplaires.some(e=>e.num===num));

function openForSaleForm(num){
  forSaleFormTargetNum = num;
  document.getElementById("sheet").innerHTML = renderForSaleForm(num);

  document.getElementById("backdrop").classList.add("open");
  attachCombo("fsf_lieu", "combo_fsf_lieu", distinctLieuxVenteAll);

  if(form) form.addEventListener("submit", handleForSaleSubmit);
}
function handleForSaleSubmit(e){
  e.preventDefault();

    return;
  }
  const date = document.getElementById("fsf_date").value || null;

  const num = forSaleFormTargetNum;
  markAsForSale(num, prix, date, lieu);

  render();

function bindEditFormEvents(){
  attachCombo("ef_serie", "combo_ef_serie", distinctSeries);
  attachCombo("ef_titre", "combo_ef_titre", distinctTitres);
  attachCombo("ef_format", "combo_ef_format", distinctFormats);
  attachCombo("ef_editeur", "combo_ef_editeur", distinctEditeurs);
  const form = document.getElementById("editForm");
  if(form) form.addEventListener("submit", e=>{
    e.preventDefault();
    const a = ALBUMS.find(x=>x.aid===sheetState.aid);
    const ex = a.exemplaires[sheetState.exIndex];
    const val = id => document.getElementById(id).value.trim();
    const cout = parseFloat(val("ef_cout")); const vente = parseFloat(val("ef_vente"));
    const fields = {

      etat: val("ef_etat") || null,
      cout: isNaN(cout) ? null : cout,
      vente: isNaN(vente) ? null : vente,
      cote: val("ef_cote") || "Non coté",
      commentaire: val("ef_commentaire") || ""

let vitrineQuery = "";
function renderVitrineManager(){
  const current = VITRINE.map((v,i)=>{
    const a = findAlbumByTitre(v.titre);
    const multi = a && a.exemplaires.length>1;
    const pills = multi ? `
      <div class="ex-pill-row">
        ${a.exemplaires.map((e,ei)=>`<button type="button" class="ex-pill ${ei===v.exIndex?'active':''}" data-vitex="${i}:${ei}">${ei+1}</button>`).join("")}
      </div>
    ` : "";
    return `
      <div class="vitrine-pick">
        <div>
          <div class="album-title" style="font-size:14px;">${v.titre}</div>
          <div class="album-sub">${a ? a.serie+(multi?" · choisis l'exemplaire :":"") : "Introuvable dans ta collection"}</div>
          ${pills}
        </div>
        <button type="button" class="vitrine-remove" data-removevitrine="${i}">Retirer</button>
      </div>
    `;
  }).join("") || `<p class="empty" style="padding:20px 0;">Aucun album en vitrine pour l'instant.</p>`;

  const q = normalizeText(vitrineQuery);
  const vitrineTitres = VITRINE.map(v=>v.titre);
  const results = q ? OWNED.filter(a=>!vitrineTitres.includes(a.titre) && normalizeText(a.titre).includes(q)).slice(0,8) : [];
  const resultsHtml = results.map(a=>`
    <div class="vitrine-pick" data-addvitrine="${a.titre.replace(/"/g,'&quot;')}">
      <div>
        <div class="album-title" style="font-size:14px;">${a.titre}</div>
        <div class="album-sub">${a.serie} · T${a.tome}</div>
      </div>
      <span class="chev">+</span>
    </div>
  `).join("");

  return `
    <button class="close-x" id="closeSheet">&times;</button>
    <div class="sheet-handle"></div>
    <div class="sheet-eyebrow">Étagère</div>
    <div class="sheet-title">Gérer la vitrine</div>

  `;
}

function renderChangelog(){
  const items = CHANGELOG.map(c=>`
    <div style="padding:12px 0; border-bottom:1px solid var(--line);">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--accent); margin-bottom:6px;">
        <span>Version ${c.version}</span><span style="color:var(--ink-soft); font-weight:400;">${c.date}</span>
      </div>
      <ul style="margin:0; padding-left:18px; font-size:13px; color:var(--ink-soft); line-height:1.6;">
        ${c.changes.map(line=>`<li style="margin-bottom:3px;">${line}</li>`).join("")}
      </ul>
    </div>
  `).join("");
  return `
    <button class="close-x" id="closeSheet">&times;</button>
    <div class="sheet-handle"></div>
    <div class="sheet-eyebrow">Historique</div>
    <div class="sheet-title">Nouveautés de l'application</div>
    ${items}
    <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.6; text-align:center; font-style:italic; margin:18px 4px 4px;">🐗 50 avant J.-C. — Toute la Gaule est occupée par les Romains... enfin presque : un petit village résiste encore et toujours à l'envahisseur. Les nouveautés des versions antérieures à 1.2.12, elles, n'ont pas eu cette chance — le papyrus n'existait pas encore par ici, et aucun druide n'avait trouvé de sortilège pour graver un journal de mise à jour dans le menhir. Panoramix y travaille, mais la potion magique ne fait toujours pas de rétroactif.</p>
  `;
}
function openChangelog(){
  document.getElementById("sheet").innerHTML = renderChangelog();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
}
function openGuide(){
  document.getElementById("sheet").innerHTML = renderGuide();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
  bindGuideSearch();
}
function bindGuideSearch(){
  const input = document.getElementById("guideSearch");
  if(!input) return;
  input.addEventListener("input", ()=>{
    const q = normalizeText(input.value);
    const items = document.querySelectorAll("#guideResults .faq-item");
    let anyVisible = false;
    items.forEach(el=>{
      const matches = !q || normalizeText(el.textContent).includes(q);
      el.style.display = matches ? "" : "none";
      el.open = !!q && matches; // pendant une recherche, ouvre directement les résultats pertinents
      if(matches) anyVisible = true;
    });
    const noResults = document.getElementById("guideNoResults");
    if(noResults) noResults.style.display = (q && !anyVisible) ? "" : "none";
  });
}
function openVitrineManager(){
  vitrineQuery = "";
  document.getElementById("sheet").innerHTML = renderVitrineManager();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
  bindVitrineManagerEvents();
}
function bindVitrineManagerEvents(){
  document.querySelectorAll("[data-removevitrine]").forEach(el=>{
    el.addEventListener("click", ()=>{
      VITRINE.splice(Number(el.dataset.removevitrine), 1);
      saveVitrine();
      refreshVitrineManagerAndShelf();
    });
  });
  document.querySelectorAll("[data-vitex]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const [i, ei] = el.dataset.vitex.split(":").map(Number);
      VITRINE[i].exIndex = ei;
      saveVitrine();
      refreshVitrineManagerAndShelf();
    });
  });
  document.querySelectorAll("[data-addvitrine]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const titre = el.dataset.addvitrine;
      if(!VITRINE.some(v=>v.titre===titre)) VITRINE.push({ titre, exIndex:0 });
      saveVitrine();
      vitrineQuery = "";
      refreshVitrineManagerAndShelf();
    });
  });
  const searchBox = document.getElementById("vitrineSearch");
  if(searchBox){
    searchBox.addEventListener("input", e=>{
      vitrineQuery = e.target.value;
      const caret = searchBox.selectionStart;
      document.getElementById("sheet").innerHTML = renderVitrineManager();
      bindVitrineManagerEvents();
      const nb = document.getElementById("vitrineSearch");
      if(nb){ nb.focus(); nb.setSelectionRange(caret, caret); }
    });
  }
}
function refreshVitrineManagerAndShelf(){
  document.getElementById("sheet").innerHTML = renderVitrineManager();
  bindVitrineManagerEvents();
  if(state.tab==="shelf") render();
}

// re-rendu léger pendant la frappe dans la recherche (garde le focus du clavier)
function renderPartialCollection(){
  const appEl = document.getElementById("app");
  const scrollY = appEl.scrollTop;
  const main = document.getElementById("main");
  const box = document.getElementById("searchBox");
  const caret = box ? box.selectionStart : null;
  main.innerHTML = renderCollection();
  document.querySelectorAll("[data-detail]").forEach(el=> el.addEventListener("click", ()=>openDetail(el.dataset.detail, el.dataset.exidx)));
  document.querySelectorAll(".chip").forEach(el=> el.addEventListener("click", ()=>{ state.filterSerie = el.dataset.chip || null; state.filterFormat = null; render(); }));
  const sortSelect = document.getElementById("sortSelect");
  if(sortSelect) sortSelect.addEventListener("change", e=>{ state.sort = e.target.value; render(); });
  const formatFilterSelect = document.getElementById("formatFilterSelect");
  if(formatFilterSelect) formatFilterSelect.addEventListener("change", e=>{ state.filterFormat = e.target.value || null; render(); });
  const etatFilterSelect = document.getElementById("etatFilterSelect");
  if(etatFilterSelect) etatFilterSelect.addEventListener("change", e=>{ state.filterEtat = e.target.value || null; render(); });
  bindClearSearch();
  const newBox = document.getElementById("searchBox");
  if(newBox){
    newBox.focus();
    if(caret!==null) newBox.setSelectionRange(caret, caret);
    newBox.addEventListener("input", e=>{ state.query = e.target.value; renderPartialCollection(); });
  }
  appEl.scrollTop = scrollY;
}

  document.body.innerHTML = renderVisitorExpiredScreen();
}
let visitorTimerInterval = null;
function updateVisitorTimer(){
  const remaining = new Date(VISITOR_SESSION_RAW.expiresAt).getTime() - Date.now();
  if(remaining <= 0){ expireVisitorSessionNow(); return; }
  const mm = Math.floor(remaining/60000);
  const ss = Math.floor((remaining%60000)/1000);
  const el = document.getElementById("visitorTimer");
  if(el) el.textContent = `${mm}:${String(ss).padStart(2,"0")}`;
}

if(VISITOR_EXPIRED){
  clearVisitorStorage();
  document.body.innerHTML = renderVisitorExpiredScreen();
} else {
  if(IS_VISITOR){
    document.body.classList.add("visitor-mode");
    if(state.tab==="ajouter") state.tab = "shelf"; // défensif : jamais sur l'onglet Ajouter en session visiteur
    const banner = document.getElementById("visitorBanner");
    if(banner) banner.style.display = "flex";
    updateVisitorTimer();
    visitorTimerInterval = setInterval(updateVisitorTimer, 1000);
    const exitBtn = document.getElementById("visitorExitBtn");
    if(exitBtn) exitBtn.addEventListener("click", ()=>{
      showConfirm("Quitter le mode visiteur ? Les données affichées seront effacées de cet appareil.", "Quitter", ()=>{
        if(visitorTimerInterval) clearInterval(visitorTimerInterval);
        clearVisitorStorage();
        location.reload();
      });
    });
  }

  render();
  idbLoadAllPhotos().then(p=>{
    // Fusion (et non écrasement) : si un import de sauvegarde a déjà ajouté des photos en mémoire
    // avant la fin de ce chargement initial, on ne veut surtout pas les perdre.
    Object.keys(p).forEach(key=>{
      if(!PHOTOS[key]) PHOTOS[key] = p[key];
      else PHOTOS[key] = [...new Set([...p[key], ...PHOTOS[key]])];
    });
    render();
    if(document.getElementById("sheet").classList.contains("open")) document.getElementById("sheet").innerHTML = renderSheet();
  });
}
</script>
</body>
</html>
